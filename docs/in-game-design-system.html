  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4c6b42ac-9e93-4d4e-82f0-3bce9125cb2b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f680eab9-cc07-41ae-aa1d-dfa473d775f4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2d7d244f-c9c8-408b-971c-6d98dda5a0b3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------- CORE PALETTE ---------------------------------\n     Pulled directly from the \"World & Art Direction\" page swatches:\n     CRT teal, amber, rust, mauve, stone grey, cream, acid green.\n     Treat these as paint chips, not gradients — keep flat. */\n\n  --vc-paper:        #efe8d4;   /* main page / \"cream\" */\n  --vc-paper-warm:   #e6dcc1;   /* slightly warmer panel ground */\n  --vc-paper-cool:   #ddd4ba;   /* cooler card ground */\n  --vc-ink:          #16231f;   /* near-black graphite, NOT pure black */\n  --vc-ink-soft:     #2c3a33;   /* secondary ink */\n  --vc-ink-mute:     #5b6660;   /* muted body / metadata */\n  --vc-rule:         #1a2520;   /* hairline borders */\n  --vc-rule-soft:    #b9b09a;   /* lighter rule for grids */\n\n  --vc-teal:         #0e5547;   /* primary — display titles, CRT phosphor */\n  --vc-teal-dark:    #073629;\n  --vc-teal-bright:  #1aa080;   /* on-screen glow / live state */\n\n  --vc-amber:        #c9892a;   /* warm accent, build numbers */\n  --vc-rust:         #b04a23;   /* warning, risk */\n  --vc-mauve:        #8a5e7c;   /* karma / culture */\n  --vc-stone:        #6f7773;   /* infrastructure */\n  --vc-cream:        #f4ecd6;   /* highlight cream */\n  --vc-acid:         #a3c33e;   /* OSS, \"live\", positive ethics */\n\n  /* ---------- SEMANTIC TOKENS ------------------------------ */\n\n  --vc-bg:           var(--vc-paper);\n  --vc-bg-elev:      var(--vc-cream);   /* cards float a hair lighter */\n  --vc-bg-screen:    #0d1814;           /* in-game CRT screens */\n  --vc-bg-screen-2:  #0a1410;           /* deeper CRT */\n\n  --vc-fg:           var(--vc-ink);\n  --vc-fg-soft:      var(--vc-ink-soft);\n  --vc-fg-mute:      var(--vc-ink-mute);\n  --vc-fg-on-screen: #c8e8d8;           /* phosphor green-on-CRT */\n  --vc-fg-on-screen-mute: #6a8a78;\n\n  --vc-accent:       var(--vc-teal);\n  --vc-accent-on-screen: var(--vc-teal-bright);\n\n  /* state colors */\n  --vc-ok:        var(--vc-acid);\n  --vc-warn:      var(--vc-amber);\n  --vc-risk:      var(--vc-rust);\n  --vc-info:      var(--vc-teal-bright);\n  --vc-karma:     var(--vc-mauve);\n\n  /* ---------- TYPE FAMILIES ------------------------------- */\n\n  --vc-font-display: 'Pixelify Sans', 'Silkscreen', system-ui, sans-serif;\n  --vc-font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n  --vc-font-crt:     'VT323', ui-monospace, monospace;       /* in-game UI */\n  --vc-font-quote:   'Special Elite', 'Courier Prime', monospace; /* typewriter */\n  --vc-font-body:    'JetBrains Mono', ui-monospace, monospace;\n\n  /* ---------- TYPE SCALE ---------------------------------- */\n  /* Display sizes are big and chunky; body is set tight in mono. */\n\n  --vc-size-d1:    72px;   /* hero page title */\n  --vc-size-d2:    52px;\n  --vc-size-d3:    36px;\n  --vc-size-h1:    28px;\n  --vc-size-h2:    22px;\n  --vc-size-h3:    18px;\n  --vc-size-body:  14px;\n  --vc-size-small: 12px;\n  --vc-size-tiny:  10px;\n\n  --vc-leading-tight:   1.05;\n  --vc-leading-display: 1.0;\n  --vc-leading-body:    1.5;\n  --vc-leading-loose:   1.7;\n\n  --vc-track-display: 0.01em;\n  --vc-track-label:   0.12em;   /* labels are spaced and uppercased */\n  --vc-track-body:    0;\n\n  /* ---------- SPACING / RADIUS / BORDER ------------------- */\n  /* The book uses a 4px base; cards have small radii (4–8px). */\n\n  --vc-space-1:  2px;\n  --vc-space-2:  4px;\n  --vc-space-3:  8px;\n  --vc-space-4:  12px;\n  --vc-space-5:  16px;\n  --vc-space-6:  24px;\n  --vc-space-7:  32px;\n  --vc-space-8:  48px;\n  --vc-space-9:  64px;\n\n  --vc-radius-0: 0;\n  --vc-radius-1: 2px;\n  --vc-radius-2: 4px;\n  --vc-radius-3: 6px;\n  --vc-radius-4: 10px;       /* card */\n  --vc-radius-pill: 999px;\n\n  --vc-border-hair:  1px solid var(--vc-rule);\n  --vc-border-soft:  1px solid var(--vc-rule-soft);\n  --vc-border-thick: 2px solid var(--vc-rule);\n\n  /* shadow system: barely-there print shadow + inset CRT bezel */\n  --vc-shadow-print: 0 1px 0 rgba(20,30,25,.10), 0 0 0 1px rgba(20,30,25,.04);\n  --vc-shadow-card:  0 1px 0 rgba(20,30,25,.18), 0 2px 0 rgba(20,30,25,.04);\n  --vc-shadow-crt-bezel:\n      inset 0 0 0 2px #1a2a22,\n      inset 0 0 0 4px #0a1410,\n      inset 0 18px 24px -16px rgba(0,0,0,.5),\n      inset 0 -18px 24px -16px rgba(0,0,0,.5);\n  --vc-glow-crt: 0 0 1px rgba(26,160,128,.7), 0 0 8px rgba(26,160,128,.25);\n\n  /* ---------- MOTION -------------------------------------- */\n  --vc-ease-step: steps(4, end);            /* CRT-style step animation */\n  --vc-ease-out:  cubic-bezier(.2,.7,.2,1); /* subtle deceleration */\n  --vc-dur-1: 80ms;\n  --vc-dur-2: 160ms;\n  --vc-dur-3: 320ms;\n\n  /* ---------- BACKGROUNDS / TEXTURES ---------------------- */\n  /* Subtle paper grid + tiny chip-mark margin pattern. */\n\n  --vc-grid-paper:\n      linear-gradient(rgba(20,30,25,.045) 1px, transparent 1px) 0 0 / 100% 24px,\n      linear-gradient(90deg, rgba(20,30,25,.045) 1px, transparent 1px) 0 0 / 24px 100%,\n      radial-gradient(circle at 30% 20%, rgba(176,74,35,.04), transparent 60%),\n      var(--vc-paper);\n\n  --vc-grid-fine:\n      linear-gradient(rgba(20,30,25,.05) 1px, transparent 1px) 0 0 / 100% 8px,\n      linear-gradient(90deg, rgba(20,30,25,.05) 1px, transparent 1px) 0 0 / 8px 100%,\n      var(--vc-paper);\n}\n\n/* ============================================================\n   GLOBAL DEFAULTS\n   ============================================================ */\nhtml, body {\n  background: var(--vc-bg);\n  color: var(--vc-fg);\n  font-family: var(--vc-font-body);\n  font-size: var(--vc-size-body);\n  line-height: var(--vc-leading-body);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: geometricPrecision;\n}\n\n/* ============================================================\n   TYPOGRAPHY — semantic helpers\n   Use either the CSS class (.vc-d1) or the bare element style.\n   ============================================================ */\n\n.vc-d1, .vc-d2, .vc-d3 {\n  font-family: var(--vc-font-display);\n  font-weight: 700;\n  letter-spacing: var(--vc-track-display);\n  line-height: var(--vc-leading-display);\n  color: var(--vc-teal);\n  text-transform: uppercase;\n}\n.vc-d1 { font-size: var(--vc-size-d1); }\n.vc-d2 { font-size: var(--vc-size-d2); }\n.vc-d3 { font-size: var(--vc-size-d3); }\n\n.vc-h1 { font-family: var(--vc-font-display); font-weight: 600; font-size: var(--vc-size-h1); color: var(--vc-fg); text-transform: uppercase; letter-spacing: .02em; }\n.vc-h2 { font-family: var(--vc-font-display); font-weight: 500; font-size: var(--vc-size-h2); color: var(--vc-fg); }\n.vc-h3 { font-family: var(--vc-font-mono); font-weight: 700; font-size: var(--vc-size-h3); color: var(--vc-fg); }\n\n.vc-body  { font-family: var(--vc-font-body); font-size: var(--vc-size-body); color: var(--vc-fg-soft); line-height: var(--vc-leading-body); }\n.vc-small { font-family: var(--vc-font-body); font-size: var(--vc-size-small); color: var(--vc-fg-mute); }\n.vc-tiny  { font-family: var(--vc-font-body); font-size: var(--vc-size-tiny);  color: var(--vc-fg-mute); letter-spacing: var(--vc-track-label); text-transform: uppercase; }\n\n/* CRT (in-game on-screen text) */\n.vc-crt {\n  font-family: var(--vc-font-crt);\n  color: var(--vc-fg-on-screen);\n  font-size: 18px;\n  letter-spacing: .04em;\n  text-shadow: 0 0 6px rgba(26,160,128,.35);\n}\n.vc-crt-amber { color: var(--vc-amber); text-shadow: 0 0 6px rgba(201,137,42,.35); }\n.vc-crt-acid  { color: var(--vc-acid);  text-shadow: 0 0 6px rgba(163,195,62,.35); }\n\n/* Typewriter italic — used for footer quotes */\n.vc-quote {\n  font-family: var(--vc-font-quote);\n  font-style: italic;\n  color: var(--vc-rust);\n  font-size: var(--vc-size-body);\n  letter-spacing: .01em;\n}\n\n/* Labels — tiny uppercase tracked, the workhorse of this brand */\n.vc-label {\n  font-family: var(--vc-font-mono);\n  font-weight: 600;\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: var(--vc-track-label);\n  color: var(--vc-fg-soft);\n}\n\n/* Inline code */\ncode, .vc-code {\n  font-family: var(--vc-font-mono);\n  font-size: 13px;\n  background: rgba(14,85,71,.08);\n  color: var(--vc-teal-dark);\n  padding: 1px 4px;\n  border-radius: var(--vc-radius-1);\n  border: 1px solid rgba(14,85,71,.18);\n}\n\n/* ============================================================\n   CORE COMPONENT PRIMITIVES\n   ============================================================ */\n\n/* Page frame: cream paper with crosshair corners (used for hero\n   layouts and slide-style frames). */\n.vc-page {\n  background: var(--vc-grid-paper);\n  color: var(--vc-fg);\n  padding: var(--vc-space-7);\n  position: relative;\n  border: var(--vc-border-hair);\n  border-radius: var(--vc-radius-2);\n}\n.vc-page::before, .vc-page::after,\n.vc-page > .vc-crosshair {\n  content: \"+\";\n  position: absolute;\n  font-family: var(--vc-font-mono);\n  color: var(--vc-rule);\n  font-size: 16px;\n  line-height: 1;\n}\n.vc-page::before { top: 8px;    left: 8px; }\n.vc-page::after  { bottom: 8px; right: 8px; }\n\n/* Card — the bread-and-butter framed panel. Hairline border,\n   tiny radius, slight inner cream highlight, microscopic shadow. */\n.vc-card {\n  background: var(--vc-bg-elev);\n  border: var(--vc-border-hair);\n  border-radius: var(--vc-radius-2);\n  padding: var(--vc-space-4) var(--vc-space-5);\n  box-shadow: var(--vc-shadow-card);\n}\n\n/* \"Numbered panel\" — the [1] SOLO CODER style numbered card.\n   Uses ::before to render the bracketed number tab. */\n.vc-numbered {\n  position: relative;\n  border: var(--vc-border-hair);\n  border-radius: var(--vc-radius-2);\n  background: var(--vc-bg-elev);\n  padding: var(--vc-space-6) var(--vc-space-5) var(--vc-space-5);\n}\n.vc-numbered > .vc-numbered-tab {\n  position: absolute;\n  top: -1px;\n  left: var(--vc-space-4);\n  transform: translateY(-50%);\n  background: var(--vc-paper);\n  border: var(--vc-border-hair);\n  padding: 2px var(--vc-space-3);\n  font-family: var(--vc-font-mono);\n  font-weight: 700;\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: var(--vc-track-label);\n  color: var(--vc-fg);\n  border-radius: var(--vc-radius-1);\n}\n.vc-numbered > .vc-numbered-tab > .num {\n  display: inline-block;\n  background: var(--vc-fg);\n  color: var(--vc-paper);\n  padding: 0 5px;\n  margin-right: 6px;\n  border-radius: 2px;\n}\n\n/* CRT screen — the \"in-game\" black panel. */\n.vc-crt-screen {\n  background:\n    radial-gradient(ellipse at 50% 20%, rgba(26,160,128,.08), transparent 70%),\n    repeating-linear-gradient(\n      to bottom,\n      rgba(255,255,255,.025) 0 1px,\n      transparent 1px 3px\n    ),\n    var(--vc-bg-screen);\n  color: var(--vc-fg-on-screen);\n  font-family: var(--vc-font-crt);\n  border-radius: var(--vc-radius-3);\n  box-shadow: var(--vc-shadow-crt-bezel);\n  padding: var(--vc-space-5) var(--vc-space-5);\n  position: relative;\n  overflow: hidden;\n}\n.vc-crt-screen::after {\n  /* subtle scanline fade at top + bottom */\n  content: \"\";\n  position: absolute; inset: 0;\n  background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 12%, transparent 88%, rgba(0,0,0,.35));\n  pointer-events: none;\n}\n\n/* Buttons */\n.vc-btn {\n  font-family: var(--vc-font-mono);\n  font-weight: 600;\n  font-size: 12px;\n  text-transform: uppercase;\n  letter-spacing: var(--vc-track-label);\n  color: var(--vc-fg);\n  background: var(--vc-paper);\n  border: var(--vc-border-hair);\n  border-radius: var(--vc-radius-2);\n  padding: 8px 14px;\n  cursor: pointer;\n  transition: transform var(--vc-dur-1) var(--vc-ease-out),\n              background var(--vc-dur-2) var(--vc-ease-out);\n}\n.vc-btn:hover  { background: var(--vc-cream); }\n.vc-btn:active { transform: translateY(1px); background: var(--vc-paper-warm); }\n.vc-btn--primary {\n  background: var(--vc-teal);\n  color: var(--vc-cream);\n  border-color: var(--vc-teal-dark);\n}\n.vc-btn--primary:hover { background: var(--vc-teal-dark); }\n.vc-btn--ghost {\n  background: transparent;\n  border-color: var(--vc-rule-soft);\n}\n\n/* Pixel chip / tag */\n.vc-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--vc-font-mono);\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: var(--vc-track-label);\n  padding: 2px 8px;\n  background: var(--vc-paper-warm);\n  border: var(--vc-border-hair);\n  border-radius: var(--vc-radius-1);\n  color: var(--vc-fg);\n}\n.vc-chip--ok   { background: rgba(163,195,62,.22); border-color: #6e8a1f; color: #3f5310; }\n.vc-chip--warn { background: rgba(201,137,42,.22); border-color: #8a5d18; color: #5f3f0d; }\n.vc-chip--risk { background: rgba(176,74,35,.18);  border-color: #7a3013; color: #5b2410; }\n.vc-chip--live { background: var(--vc-bg-screen);  border-color: var(--vc-teal-bright); color: var(--vc-teal-bright); text-shadow: 0 0 4px rgba(26,160,128,.5); }\n\n/* Footer \"field manual\" strip */\n.vc-footer-strip {\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  align-items: center;\n  gap: var(--vc-space-6);\n  padding: var(--vc-space-4) var(--vc-space-5);\n  border-top: var(--vc-border-hair);\n  font-family: var(--vc-font-mono);\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: var(--vc-track-label);\n  color: var(--vc-fg-soft);\n  background: var(--vc-paper);\n}\n\n/* Decorative chip column (the tiny color squares running down\n   the left margin of every page in the design book). */\n.vc-chip-stack { display: flex; flex-direction: column; gap: 4px; }\n.vc-chip-stack > i {\n  display: block; width: 10px; height: 10px;\n  background: currentColor;\n}\n<\u002Fstyle>\n  <style>/* =============================================================\n   In-Game Design System — long-scroll bible page\n   Stacks on top of colors_and_type.css\n   ============================================================= */\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  background: var(--vc-paper);\n  color: var(--vc-fg);\n  font-family: var(--vc-font-body);\n  min-height: 100vh;\n}\n\n/* ---- Outer page chrome -------------------------------------- */\n.bible {\n  max-width: 1200px;\n  margin: 0 auto;\n  padding: 28px 36px 60px;\n  position: relative;\n  background:\n    linear-gradient(rgba(20,30,25,.025) 1px, transparent 1px) 0 0 / 100% 32px,\n    linear-gradient(90deg, rgba(20,30,25,.025) 1px, transparent 1px) 0 0 / 32px 100%,\n    var(--vc-paper);\n}\n.bible::before, .bible::after {\n  position: absolute;\n  font-family: var(--vc-font-mono);\n  color: var(--vc-rule);\n  font-size: 14px;\n}\n.bible::before { content: \"+\"; top: 12px; left: 12px; }\n.bible::after  { content: \"+\"; bottom: 12px; right: 12px; }\n\n.bible-corner-tr, .bible-corner-bl {\n  position: absolute;\n  font-family: var(--vc-font-mono);\n  color: var(--vc-rule);\n  font-size: 14px;\n}\n.bible-corner-tr { top: 12px; right: 12px; }\n.bible-corner-bl { bottom: 12px; left: 12px; }\n.bible-corner-tr::before, .bible-corner-bl::before { content: \"+\"; }\n\n/* small color-chip column running down the left margin */\n.bible-stripe {\n  position: absolute; left: 16px; top: 80px;\n  display: flex; flex-direction: column; gap: 5px;\n}\n.bible-stripe i { display: block; width: 8px; height: 8px; }\n\n/* ---- Top masthead ------------------------------------------- */\n.masthead {\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  align-items: end;\n  gap: 24px;\n  padding: 8px 4px 18px;\n  border-bottom: 1px solid var(--vc-rule);\n}\n.masthead .wm { display: flex; align-items: baseline; gap: 14px; }\n.masthead .vc {\n  font-family: var(--vc-font-display);\n  font-weight: 700; font-size: 36px;\n  color: var(--vc-teal);\n  text-transform: uppercase; line-height: 1;\n}\n.masthead .slash { font-family: var(--vc-font-mono); color: var(--vc-fg-mute); font-size: 16px; }\n.masthead .sub { font-family: var(--vc-font-mono); color: var(--vc-fg-soft); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }\n.masthead .pageno { font-family: var(--vc-font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--vc-fg-mute); text-align: right; }\n\n/* ---- Hero block --------------------------------------------- */\n.hero {\n  margin: 32px 0 20px;\n}\n.hero h1 {\n  font-family: var(--vc-font-display);\n  font-weight: 700;\n  font-size: 88px;\n  line-height: .95;\n  color: var(--vc-teal);\n  text-transform: uppercase;\n  margin: 0;\n}\n.hero .ribbon {\n  display: inline-block;\n  font-family: var(--vc-font-display);\n  font-size: 18px;\n  color: var(--vc-cream);\n  background: var(--vc-fg);\n  padding: 6px 12px;\n  margin-top: 14px;\n  text-transform: none;\n  letter-spacing: 0;\n}\n.hero .lede {\n  margin-top: 22px;\n  max-width: 720px;\n  font-family: var(--vc-font-body);\n  font-size: 15px;\n  line-height: 1.65;\n  color: var(--vc-fg-soft);\n}\n\n/* ---- TOC ---------------------------------------------------- */\n.toc {\n  margin: 28px 0 40px;\n  border: 1px solid var(--vc-rule);\n  background: var(--vc-bg-elev);\n  padding: 14px 18px;\n  border-radius: 3px;\n  display: grid;\n  grid-template-columns: 200px 1fr;\n  gap: 10px 28px;\n  align-items: start;\n}\n.toc-label {\n  font-family: var(--vc-font-mono);\n  font-weight: 700;\n  font-size: 10px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--vc-fg);\n  border-right: 1px dashed var(--vc-rule-soft);\n  padding-right: 18px;\n}\n.toc-list {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px 24px;\n  margin: 0; padding: 0; list-style: none;\n}\n.toc-list li {\n  font-family: var(--vc-font-mono);\n  font-size: 11px;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n}\n.toc-list a {\n  color: var(--vc-ink);\n  text-decoration: none;\n  display: flex; align-items: baseline; gap: 8px;\n  padding: 2px 0;\n  border-bottom: 1px dotted transparent;\n}\n.toc-list a:hover { border-bottom-color: var(--vc-rule); color: var(--vc-teal); }\n.toc-list .num {\n  display: inline-block;\n  background: var(--vc-fg);\n  color: var(--vc-paper);\n  padding: 0 5px;\n  border-radius: 2px;\n  font-size: 10px;\n  font-weight: 700;\n  min-width: 18px;\n  text-align: center;\n}\n\n/* ---- Section frame ----------------------------------------- */\n.section {\n  padding: 28px 0;\n  border-top: 1px solid var(--vc-rule);\n  scroll-margin-top: 16px;\n}\n.section:first-of-type { border-top: none; }\n.section-head {\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  align-items: baseline;\n  gap: 18px;\n  margin-bottom: 6px;\n}\n.section-num {\n  font-family: var(--vc-font-mono);\n  font-weight: 700;\n  font-size: 11px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--vc-paper);\n  background: var(--vc-fg);\n  padding: 3px 8px;\n  border-radius: 2px;\n}\n.section-num em { font-style: normal; color: var(--vc-acid); margin-right: 6px; }\n.section-tag {\n  font-family: var(--vc-font-mono);\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--vc-fg-mute);\n  text-align: right;\n}\n.section-title {\n  font-family: var(--vc-font-display);\n  font-weight: 700;\n  font-size: 48px;\n  line-height: 1;\n  color: var(--vc-teal);\n  text-transform: uppercase;\n  margin: 4px 0 4px;\n}\n.section-sub {\n  font-family: var(--vc-font-quote);\n  font-style: italic;\n  color: var(--vc-rust);\n  font-size: 16px;\n  margin: 0 0 18px;\n}\n.section-body p {\n  max-width: 760px;\n  font-family: var(--vc-font-body);\n  font-size: 13.5px;\n  line-height: 1.65;\n  color: var(--vc-fg-soft);\n  margin: 0 0 12px;\n}\n\n/* ---- Specimens — generic blocks ---------------------------- */\n.spec-grid {\n  display: grid;\n  grid-template-columns: repeat(12, 1fr);\n  gap: 12px;\n  margin: 16px 0;\n}\n.spec {\n  grid-column: span 6;\n  background: var(--vc-bg-elev);\n  border: 1px solid var(--vc-rule);\n  border-radius: 3px;\n  padding: 14px 16px;\n  position: relative;\n}\n.spec.span-3  { grid-column: span 3; }\n.spec.span-4  { grid-column: span 4; }\n.spec.span-6  { grid-column: span 6; }\n.spec.span-8  { grid-column: span 8; }\n.spec.span-12 { grid-column: span 12; }\n.spec-label {\n  font-family: var(--vc-font-mono);\n  font-weight: 700;\n  font-size: 9.5px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--vc-fg);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 8px;\n  margin: 0 0 8px;\n  padding-bottom: 6px;\n  border-bottom: 1px dashed var(--vc-rule-soft);\n}\n.spec-label .meta { color: var(--vc-fg-mute); font-weight: 500; letter-spacing: .12em; }\n.spec-note {\n  margin-top: 10px;\n  font-family: var(--vc-font-body);\n  font-size: 11px;\n  color: var(--vc-fg-mute);\n  line-height: 1.5;\n}\n\n.spec-stage {\n  background: var(--vc-bg-screen);\n  background-image:\n    repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);\n  border-radius: 4px;\n  padding: 14px;\n  box-shadow: var(--vc-shadow-crt-bezel);\n}\n\n/* token tables */\n.tok-table {\n  width: 100%;\n  border-collapse: collapse;\n  font-family: var(--vc-font-mono);\n  font-size: 11px;\n}\n.tok-table th, .tok-table td {\n  text-align: left;\n  padding: 5px 8px;\n  border-bottom: 1px dotted var(--vc-rule-soft);\n  vertical-align: middle;\n}\n.tok-table th {\n  font-size: 9.5px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--vc-fg-mute);\n  border-bottom: 1px solid var(--vc-rule);\n}\n.tok-table .swatch {\n  display: inline-block;\n  width: 18px; height: 18px;\n  border: 1px solid var(--vc-rule);\n  vertical-align: middle;\n  margin-right: 8px;\n  border-radius: 2px;\n}\n.tok-table code {\n  background: transparent; border: none; padding: 0;\n  color: var(--vc-teal-dark);\n  font-size: 11px;\n}\n.tok-table .role {\n  font-family: var(--vc-font-body);\n  font-size: 10.5px;\n  color: var(--vc-fg-mute);\n}\n\n/* color swatch grid */\n.swatches {\n  display: grid;\n  grid-template-columns: repeat(6, 1fr);\n  gap: 6px;\n}\n.sw {\n  height: 78px;\n  border: 1px solid var(--vc-rule);\n  border-radius: 3px;\n  position: relative;\n  display: flex;\n  align-items: flex-end;\n  padding: 6px 8px;\n  font-family: var(--vc-font-mono);\n  font-size: 9px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n}\n.sw .nm { color: rgba(255,255,255,.92); text-shadow: 0 1px 0 rgba(0,0,0,.5); }\n.sw.dark .nm { color: rgba(255,255,255,.92); }\n.sw.light .nm { color: var(--vc-fg); text-shadow: none; }\n.sw .hx {\n  position: absolute; top: 6px; right: 8px;\n  font-size: 9px; letter-spacing: .04em;\n  color: rgba(255,255,255,.7); text-shadow: 0 1px 0 rgba(0,0,0,.5);\n}\n.sw.light .hx { color: var(--vc-fg-mute); text-shadow: none; }\n\n/* CRT-on-CRT swatches (phosphor variants) */\n.phosphor-row {\n  display: grid;\n  grid-template-columns: repeat(6, 1fr);\n  gap: 6px;\n}\n.phosphor {\n  background: var(--vc-bg-screen);\n  border: 1px solid rgba(200,232,216,.25);\n  border-radius: 3px;\n  padding: 14px 10px;\n  text-align: center;\n  font-family: var(--vc-font-crt);\n  font-size: 24px;\n  letter-spacing: .12em;\n}\n.phosphor small {\n  display: block;\n  margin-top: 6px;\n  font-family: var(--vc-font-mono);\n  font-size: 9px;\n  letter-spacing: .14em;\n  color: var(--vc-fg-on-screen-mute);\n}\n\n/* type specimens */\n.type-line {\n  display: grid;\n  grid-template-columns: 130px 1fr;\n  gap: 16px;\n  align-items: baseline;\n  padding: 8px 0;\n  border-bottom: 1px dotted var(--vc-rule-soft);\n}\n.type-line:last-child { border-bottom: none; }\n.type-line .meta {\n  font-family: var(--vc-font-mono);\n  font-size: 9.5px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--vc-fg-mute);\n}\n.type-line .meta b {\n  display: block;\n  color: var(--vc-fg);\n  font-size: 10px;\n  letter-spacing: .12em;\n  margin-top: 2px;\n}\n.type-line .sample { color: var(--vc-fg); }\n\n/* spacing / radius rulers */\n.ruler {\n  display: flex; align-items: flex-end; gap: 6px;\n  height: 80px;\n  padding: 8px 4px;\n}\n.ruler .step {\n  background: var(--vc-teal);\n  border-radius: 2px 2px 0 0;\n  flex: 0 0 auto;\n  width: 28px;\n  position: relative;\n}\n.ruler .step::after {\n  content: attr(data-val);\n  position: absolute; top: -16px; left: 50%; transform: translateX(-50%);\n  font-family: var(--vc-font-mono); font-size: 9px; color: var(--vc-fg-mute);\n  letter-spacing: .1em;\n}\n.ruler .step::before {\n  content: attr(data-name);\n  position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);\n  font-family: var(--vc-font-mono); font-size: 9px; color: var(--vc-fg);\n  letter-spacing: .1em; text-transform: uppercase;\n}\n\n.radii {\n  display: flex; gap: 12px; align-items: flex-end;\n}\n.radii .rad {\n  background: var(--vc-teal);\n  width: 56px; height: 56px;\n  display: grid; place-items: end center;\n  padding-bottom: 4px;\n  font-family: var(--vc-font-mono); font-size: 9px; color: var(--vc-cream);\n  letter-spacing: .12em;\n}\n\n.borderpins {\n  display: flex; gap: 10px; flex-wrap: wrap;\n}\n.borderpins .pin {\n  padding: 6px 10px;\n  background: var(--vc-paper);\n  font-family: var(--vc-font-mono);\n  font-size: 10px;\n  letter-spacing: .1em;\n  color: var(--vc-fg);\n}\n.borderpins .pin.hair  { border: 1px solid var(--vc-rule); }\n.borderpins .pin.soft  { border: 1px solid var(--vc-rule-soft); }\n.borderpins .pin.thick { border: 2px solid var(--vc-rule); }\n.borderpins .pin.dash  { border: 1px dashed var(--vc-rule); }\n.borderpins .pin.crt   { border: 1px solid rgba(200,232,216,.3); background: var(--vc-bg-screen); color: var(--vc-fg-on-screen); font-family: var(--vc-font-crt); }\n\n/* corner-mark demo */\n.cornermark-demo {\n  position: relative;\n  background: var(--vc-paper-warm);\n  border: 1px solid var(--vc-rule);\n  border-radius: 3px;\n  padding: 36px 18px 30px;\n  font-family: var(--vc-font-mono);\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--vc-fg-mute);\n  text-align: center;\n}\n.cornermark-demo::before, .cornermark-demo::after,\n.cornermark-demo .corner-tl, .cornermark-demo .corner-bl {\n  position: absolute;\n  font-family: var(--vc-font-mono);\n  color: var(--vc-rule);\n  font-size: 14px;\n}\n.cornermark-demo::before { content: \"+\"; top: 6px; left: 6px; }\n.cornermark-demo::after  { content: \"+\"; bottom: 6px; right: 6px; }\n.cornermark-demo .corner-tl { content: \"+\"; top: 6px; right: 6px; }\n.cornermark-demo .corner-bl { bottom: 6px; left: 6px; }\n.cornermark-demo .corner-tl::before, .cornermark-demo .corner-bl::before { content: \"+\"; }\n\n/* scanline demo */\n.scanline-demo {\n  background: var(--vc-bg-screen);\n  border-radius: 4px;\n  box-shadow: var(--vc-shadow-crt-bezel);\n  padding: 40px 14px;\n  text-align: center;\n  position: relative;\n  overflow: hidden;\n}\n.scanline-demo .lab {\n  font-family: var(--vc-font-crt);\n  font-size: 24px;\n  color: var(--vc-fg-on-screen);\n  text-shadow: 0 0 6px rgba(26,160,128,.5);\n  letter-spacing: .14em;\n}\n.scanline-demo.l1 { background-image: var(--scan-1); }\n.scanline-demo.l2 { background-image: var(--scan-2); }\n.scanline-demo.l3 { background-image: var(--scan-3); }\n:root {\n  --scan-1: repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);\n  --scan-2: repeating-linear-gradient(to bottom, rgba(255,255,255,.045) 0 1px, transparent 1px 4px);\n  --scan-3: repeating-linear-gradient(to bottom, rgba(255,255,255,.07) 0 1px, transparent 1px 6px);\n}\n\n/* ---- Panel chrome demo ------------------------------------- */\n.panel-demo {\n  background: rgba(20,40,32,.55);\n  border: 1px solid rgba(200,232,216,.22);\n  border-radius: 4px;\n  padding: 12px;\n  color: var(--vc-fg-on-screen);\n  font-family: var(--vc-font-crt);\n}\n.panel-demo + .panel-demo { margin-top: 8px; }\n.panel-demo-head {\n  display: flex; align-items: baseline; justify-content: space-between;\n  padding-bottom: 6px; margin-bottom: 8px;\n  border-bottom: 1px dashed rgba(200,232,216,.22);\n}\n.panel-demo-title {\n  font-family: var(--vc-font-mono); font-weight: 700;\n  font-size: 11px; letter-spacing: .16em;\n}\n.panel-demo .live {\n  color: var(--vc-acid);\n  font-family: var(--vc-font-mono);\n  font-size: 10px; letter-spacing: .14em;\n  text-shadow: 0 0 6px rgba(163,195,62,.4);\n}\n.panel-demo .row {\n  display: grid; grid-template-columns: 1fr auto;\n  align-items: center; gap: 8px;\n  font-size: 14px;\n  padding: 2px 0;\n}\n.panel-demo .row .v { color: var(--vc-acid); text-shadow: 0 0 6px rgba(163,195,62,.4); }\n\n/* HUD primitives ---------------------------------------------- */\n.hud-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 8px;\n}\n.stat {\n  background: rgba(0,0,0,.4);\n  border: 1px solid rgba(200,232,216,.22);\n  border-radius: 3px;\n  padding: 8px 10px;\n}\n.stat .lbl {\n  font-family: var(--vc-font-mono);\n  font-size: 9.5px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--vc-fg-on-screen-mute);\n}\n.stat .val {\n  font-family: var(--vc-font-crt);\n  font-size: 22px;\n  margin-top: 2px;\n}\n.stat .delta {\n  font-family: var(--vc-font-mono);\n  font-size: 10px;\n  letter-spacing: .1em;\n}\n.stat.ok    .val { color: var(--vc-acid); text-shadow: 0 0 6px rgba(163,195,62,.4); }\n.stat.warn  .val { color: var(--vc-amber); text-shadow: 0 0 6px rgba(201,137,42,.4); }\n.stat.risk  .val { color: var(--vc-rust); text-shadow: 0 0 6px rgba(176,74,35,.4); }\n.stat.info  .val { color: var(--vc-teal-bright); text-shadow: 0 0 6px rgba(26,160,128,.4); }\n.stat.karma .val { color: var(--vc-mauve); text-shadow: 0 0 6px rgba(138,94,124,.4); }\n\n/* segmented control */\n.seg {\n  display: inline-flex;\n  background: rgba(0,0,0,.4);\n  border: 1px solid rgba(200,232,216,.22);\n  border-radius: 4px;\n  padding: 2px;\n  font-family: var(--vc-font-mono);\n}\n.seg .seg-btn {\n  padding: 5px 12px;\n  font-size: 11px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--vc-fg-on-screen-mute);\n  background: transparent;\n  border: none;\n  cursor: pointer;\n  border-radius: 3px;\n}\n.seg .seg-btn.on {\n  background: var(--vc-teal-dark);\n  color: var(--vc-acid);\n  text-shadow: 0 0 6px rgba(163,195,62,.5);\n}\n\n/* slider track */\n.slider {\n  display: grid;\n  grid-template-columns: 100px 1fr 36px;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--vc-font-crt);\n  color: var(--vc-fg-on-screen);\n  font-size: 14px;\n  padding: 4px 0;\n}\n.slider .track {\n  height: 6px;\n  background: rgba(0,0,0,.4);\n  border: 1px solid rgba(200,232,216,.18);\n  border-radius: 999px;\n  position: relative;\n}\n.slider .fill {\n  position: absolute; left: 0; top: 0; bottom: 0;\n  background: var(--vc-teal-bright);\n  border-radius: 999px;\n}\n.slider .pct { font-size: 13px; text-align: right; }\n\n/* toggle pill */\n.tog {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  background: rgba(0,0,0,.4);\n  border: 1px solid rgba(200,232,216,.22);\n  padding: 2px 10px 2px 6px;\n  border-radius: 999px;\n  font-family: var(--vc-font-mono);\n}\n.tog .dot {\n  width: 10px; height: 10px;\n  border-radius: 999px;\n  background: rgba(200,232,216,.3);\n}\n.tog .lbl {\n  font-size: 9.5px;\n  letter-spacing: .14em;\n  color: var(--vc-fg-on-screen-mute);\n}\n.tog.on { background: rgba(14,85,71,.6); border-color: var(--vc-teal-bright); }\n.tog.on .dot { background: var(--vc-acid); box-shadow: 0 0 6px rgba(163,195,62,.7); }\n.tog.on .lbl { color: var(--vc-acid); }\n.tog.warn.on { background: rgba(176,74,35,.45); border-color: var(--vc-rust); }\n.tog.warn.on .dot { background: var(--vc-amber); }\n.tog.warn.on .lbl { color: var(--vc-amber); }\n\n/* policy slider system */\n.policy-list { display: flex; flex-direction: column; gap: 8px; }\n.policy-row { display: grid; grid-template-columns: 100px 1fr 32px; align-items: center; gap: 10px; }\n.policy-name {\n  display: flex; align-items: center; gap: 6px;\n  font-family: var(--vc-font-crt); font-size: 14px;\n  color: var(--vc-fg-on-screen);\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.policy-name .glyph { color: var(--vc-fg-on-screen-mute); width: 14px; }\n.policy-track {\n  height: 6px;\n  background: rgba(0,0,0,.4);\n  border: 1px solid rgba(200,232,216,.18);\n  border-radius: 999px;\n  position: relative;\n}\n.policy-fill {\n  position: absolute; left: 0; top: 0; bottom: 0;\n  background: var(--vc-teal-bright); border-radius: 999px;\n}\n.policy-pct {\n  font-family: var(--vc-font-crt); font-size: 13px;\n  text-align: right; color: var(--vc-fg-on-screen);\n}\n.policy-foot {\n  margin-top: 10px; padding-top: 8px;\n  border-top: 1px dashed rgba(200,232,216,.22);\n  display: flex; justify-content: space-between;\n  font-family: var(--vc-font-mono);\n  font-size: 10px; letter-spacing: .14em;\n  color: var(--vc-fg-on-screen-mute);\n}\n.policy-foot .ok { color: var(--vc-acid); text-shadow: 0 0 6px rgba(163,195,62,.4); }\n.policy-foot .warn { color: var(--vc-amber); text-shadow: 0 0 6px rgba(201,137,42,.4); }\n\n/* commit stream */\n.commit {\n  display: flex; justify-content: space-between;\n  font-family: var(--vc-font-crt);\n  font-size: 14px;\n  padding: 1px 0;\n}\n.commit .who { color: var(--vc-fg-on-screen-mute); }\n.commit .delta { color: var(--vc-acid); text-shadow: 0 0 6px rgba(163,195,62,.4); }\n.commit.warn .delta { color: var(--vc-amber); text-shadow: 0 0 6px rgba(201,137,42,.4); }\n.commit.risk .delta { color: var(--vc-rust); text-shadow: 0 0 6px rgba(176,74,35,.4); }\n\n/* event card grammar */\n.event-row {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 8px;\n}\n.evcard {\n  position: relative;\n  background: rgba(255,255,255,.05);\n  border: 1px solid rgba(200,232,216,.18);\n  border-radius: 4px;\n  padding: 22px 10px 30px;\n  color: var(--vc-fg-on-screen);\n  font-family: var(--vc-font-crt);\n}\n.evcard .dot {\n  position: absolute; top: 6px; left: 10px;\n  width: 8px; height: 8px; border-radius: 999px;\n}\n.evcard .time {\n  font-size: 13px; color: var(--vc-fg-on-screen-mute);\n  letter-spacing: .12em;\n}\n.evcard .ttl {\n  font-family: var(--vc-font-mono);\n  font-weight: 700; font-size: 11px;\n  color: var(--vc-fg-on-screen);\n  margin: 2px 0 4px; letter-spacing: .04em;\n}\n.evcard .desc {\n  font-size: 13px; color: var(--vc-fg-on-screen-mute);\n  line-height: 1.3;\n  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;\n}\n.evcard .tag {\n  position: absolute; bottom: 6px; left: 10px;\n  font-family: var(--vc-font-mono);\n  font-size: 9px; letter-spacing: .14em;\n}\n.evcard.kind-risk .dot { background: var(--vc-rust); box-shadow: 0 0 6px rgba(176,74,35,.6); }\n.evcard.kind-risk .tag { color: #e08a6a; }\n.evcard.kind-opp  .dot { background: var(--vc-acid); box-shadow: 0 0 6px rgba(163,195,62,.6); }\n.evcard.kind-opp  .tag { color: var(--vc-acid); }\n.evcard.kind-warn .dot { background: var(--vc-amber); box-shadow: 0 0 6px rgba(201,137,42,.6); }\n.evcard.kind-warn .tag { color: var(--vc-amber); }\n.evcard.kind-pol  .dot { background: var(--vc-mauve); box-shadow: 0 0 6px rgba(138,94,124,.6); }\n.evcard.kind-pol  .tag { color: #c39ab8; }\n\n/* world stage mini */\n.worldmini {\n  position: relative;\n  height: 200px;\n  border: 1px solid rgba(200,232,216,.22);\n  border-radius: 4px;\n  overflow: hidden;\n  background:\n    radial-gradient(ellipse at 35% 55%, rgba(26,160,128,.18), transparent 55%),\n    radial-gradient(ellipse at 70% 70%, rgba(201,137,42,.14), transparent 50%),\n    radial-gradient(ellipse at 60% 30%, rgba(138,94,124,.12), transparent 45%),\n    linear-gradient(180deg, #0e1a14 0%, #0a130f 100%);\n}\n.worldmini::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  background-image:\n    linear-gradient(60deg, rgba(200,232,216,.08) 1px, transparent 1px),\n    linear-gradient(-60deg, rgba(200,232,216,.08) 1px, transparent 1px);\n  background-size: 32px 56px;\n  mask-image: radial-gradient(ellipse at 50% 60%, black 30%, transparent 80%);\n}\n.worldmini::after {\n  content: \"\";\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(11,20,16,.55) 95%),\n    repeating-linear-gradient(to bottom, rgba(200,232,216,.025) 0 1px, transparent 1px 4px);\n}\n.worldmini .loc {\n  position: absolute;\n  font-family: var(--vc-font-mono);\n  font-size: 9.5px; letter-spacing: .14em;\n  color: var(--vc-fg-on-screen);\n  text-shadow: 0 1px 0 rgba(0,0,0,.7);\n  background: rgba(11,20,16,.7);\n  border: 1px solid rgba(200,232,216,.3);\n  padding: 3px 8px;\n  border-radius: 3px;\n  display: flex; align-items: center; gap: 6px;\n  z-index: 2;\n}\n.worldmini .loc .lt-dot {\n  width: 6px; height: 6px; background: var(--vc-acid);\n  border-radius: 999px;\n  box-shadow: 0 0 6px rgba(163,195,62,.7);\n}\n.worldmini .loc.warn .lt-dot { background: var(--vc-amber); box-shadow: 0 0 6px rgba(201,137,42,.7); }\n.worldmini .loc.risk .lt-dot { background: var(--vc-rust);  box-shadow: 0 0 6px rgba(176,74,35,.7); }\n\n/* tutorial bubble */\n.tutorial {\n  position: relative;\n  max-width: 320px;\n  background: var(--vc-paper-warm);\n  border: 1px solid var(--vc-rule);\n  border-radius: 4px;\n  padding: 10px 12px;\n  font-family: var(--vc-font-mono);\n  font-size: 11px;\n  color: var(--vc-fg);\n  box-shadow: 0 2px 0 rgba(20,30,25,.18), 0 4px 10px rgba(20,30,25,.12);\n}\n.tutorial::after {\n  content: \"\";\n  position: absolute; left: 24px; bottom: -8px;\n  width: 14px; height: 14px;\n  background: var(--vc-paper-warm);\n  border-right: 1px solid var(--vc-rule);\n  border-bottom: 1px solid var(--vc-rule);\n  transform: rotate(45deg);\n}\n.tutorial .head {\n  display: flex; align-items: center; gap: 6px;\n  font-weight: 700;\n  font-size: 9.5px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--vc-rust);\n  margin-bottom: 4px;\n}\n.tutorial .head::before {\n  content: \"▸\";\n  color: var(--vc-rust);\n}\n.tutorial .body {\n  font-family: var(--vc-font-body);\n  font-size: 12px;\n  line-height: 1.5;\n  color: var(--vc-fg-soft);\n}\n.tutorial .actions {\n  margin-top: 8px;\n  display: flex; gap: 6px;\n}\n.tut-btn {\n  font-family: var(--vc-font-mono);\n  font-size: 9.5px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  padding: 4px 10px;\n  background: var(--vc-paper);\n  border: 1px solid var(--vc-rule);\n  border-radius: 2px;\n  cursor: pointer;\n  color: var(--vc-fg);\n}\n.tut-btn.primary { background: var(--vc-fg); color: var(--vc-paper); border-color: var(--vc-fg); }\n\n/* modal demo */\n.modal-demo {\n  background: var(--vc-bg-screen);\n  border: 1px solid var(--vc-teal-bright);\n  border-radius: 4px;\n  padding: 18px;\n  box-shadow: var(--vc-shadow-crt-bezel), 0 0 0 1px rgba(176,74,35,.4);\n  color: var(--vc-fg-on-screen);\n  position: relative;\n}\n.modal-demo.risk { border-color: var(--vc-rust); box-shadow: var(--vc-shadow-crt-bezel), 0 0 0 1px rgba(176,74,35,.6); }\n.modal-demo .modal-tag {\n  display: inline-block;\n  font-family: var(--vc-font-mono);\n  font-size: 9.5px; letter-spacing: .16em;\n  text-transform: uppercase;\n  padding: 2px 8px;\n  background: var(--vc-rust); color: var(--vc-cream);\n  border-radius: 2px;\n}\n.modal-demo .modal-title {\n  font-family: var(--vc-font-display);\n  font-size: 26px;\n  text-transform: uppercase;\n  color: var(--vc-fg-on-screen);\n  margin: 8px 0 4px;\n  text-shadow: 0 0 6px rgba(26,160,128,.3);\n  line-height: 1.05;\n}\n.modal-demo .modal-body {\n  font-family: var(--vc-font-mono);\n  font-size: 11.5px;\n  line-height: 1.55;\n  color: var(--vc-fg-on-screen-mute);\n  margin: 0 0 12px;\n}\n.modal-demo .modal-meta {\n  font-family: var(--vc-font-mono);\n  font-size: 10px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--vc-fg-on-screen-mute);\n  margin-bottom: 12px;\n  display: flex; gap: 14px;\n}\n.modal-demo .modal-meta b { color: var(--vc-fg-on-screen); font-weight: 700; }\n.modal-demo .modal-actions {\n  display: flex; gap: 8px;\n}\n.modal-btn {\n  font-family: var(--vc-font-mono);\n  font-size: 10px; letter-spacing: .14em;\n  text-transform: uppercase;\n  padding: 7px 12px;\n  background: transparent;\n  border: 1px solid rgba(200,232,216,.4);\n  color: var(--vc-fg-on-screen);\n  border-radius: 3px;\n  cursor: pointer;\n}\n.modal-btn:hover { background: rgba(255,255,255,.06); }\n.modal-btn.primary { background: var(--vc-rust); border-color: var(--vc-rust); color: var(--vc-cream); }\n.modal-btn.primary:hover { background: #8a3c1c; }\n\n/* toast */\n.toast-stack { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }\n.toast {\n  display: flex; align-items: flex-start; gap: 10px;\n  background: var(--vc-bg-screen);\n  border: 1px solid rgba(200,232,216,.3);\n  border-left: 3px solid var(--vc-teal-bright);\n  padding: 8px 12px;\n  border-radius: 3px;\n  font-family: var(--vc-font-crt);\n  font-size: 14px;\n  color: var(--vc-fg-on-screen);\n  min-width: 280px;\n  max-width: 380px;\n  box-shadow: 0 4px 12px rgba(0,0,0,.4);\n}\n.toast .ico {\n  width: 14px; height: 14px;\n  background: var(--vc-acid);\n  border-radius: 999px;\n  flex: 0 0 auto;\n  margin-top: 4px;\n  box-shadow: 0 0 6px rgba(163,195,62,.6);\n}\n.toast .msg { line-height: 1.3; }\n.toast .meta {\n  font-family: var(--vc-font-mono);\n  font-size: 9px; letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--vc-fg-on-screen-mute);\n  margin-top: 2px;\n}\n.toast.warn { border-left-color: var(--vc-amber); }\n.toast.warn .ico { background: var(--vc-amber); box-shadow: 0 0 6px rgba(201,137,42,.6); }\n.toast.risk { border-left-color: var(--vc-rust); }\n.toast.risk .ico { background: var(--vc-rust); box-shadow: 0 0 6px rgba(176,74,35,.6); }\n.toast.karma { border-left-color: var(--vc-mauve); }\n.toast.karma .ico { background: var(--vc-mauve); box-shadow: 0 0 6px rgba(138,94,124,.6); }\n\n/* iconography spec */\n.iconwall {\n  display: grid;\n  grid-template-columns: repeat(8, 1fr);\n  gap: 8px;\n}\n.icn {\n  background: rgba(0,0,0,.35);\n  border: 1px solid rgba(200,232,216,.22);\n  border-radius: 3px;\n  aspect-ratio: 1 / 1;\n  display: grid; place-items: center;\n  position: relative;\n  padding: 6px;\n}\n.icn svg { width: 28px; height: 28px; }\n.icn .nm {\n  position: absolute; bottom: 4px; left: 0; right: 0;\n  text-align: center;\n  font-family: var(--vc-font-mono);\n  font-size: 8px;\n  letter-spacing: .12em;\n  color: var(--vc-fg-on-screen-mute);\n  text-transform: uppercase;\n}\n\n/* motion + sound tables */\n.tt {\n  width: 100%;\n  border-collapse: collapse;\n  font-family: var(--vc-font-mono);\n  font-size: 11px;\n}\n.tt th {\n  text-align: left;\n  font-size: 9.5px; letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--vc-fg-mute);\n  padding: 6px 10px 6px 0;\n  border-bottom: 1px solid var(--vc-rule);\n}\n.tt td {\n  padding: 7px 10px 7px 0;\n  border-bottom: 1px dotted var(--vc-rule-soft);\n  vertical-align: top;\n}\n.tt td.k { font-weight: 700; color: var(--vc-fg); white-space: nowrap; }\n.tt td.v { color: var(--vc-fg-soft); }\n.tt td.w {\n  font-family: var(--vc-font-body);\n  font-size: 11px;\n  color: var(--vc-fg-soft);\n  line-height: 1.5;\n}\n.tt code { background: transparent; border: none; padding: 0; color: var(--vc-teal-dark); }\n\n/* a11y notes */\n.a11y-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }\n.a11y-list li {\n  display: grid;\n  grid-template-columns: 28px 1fr;\n  gap: 10px;\n  padding: 8px 12px;\n  background: var(--vc-paper-warm);\n  border: 1px solid var(--vc-rule);\n  border-radius: 3px;\n}\n.a11y-list .num {\n  background: var(--vc-fg);\n  color: var(--vc-paper);\n  font-family: var(--vc-font-mono);\n  font-weight: 700;\n  font-size: 10px;\n  display: grid; place-items: center;\n  border-radius: 2px;\n}\n.a11y-list h4 {\n  margin: 0 0 2px;\n  font-family: var(--vc-font-mono);\n  font-weight: 700;\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--vc-fg);\n}\n.a11y-list p {\n  margin: 0;\n  font-family: var(--vc-font-body);\n  font-size: 11.5px;\n  line-height: 1.5;\n  color: var(--vc-fg-soft);\n}\n\n/* DO / DON'T */\n.dos {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n}\n.dos .col {\n  background: var(--vc-bg-elev);\n  border: 1px solid var(--vc-rule);\n  border-radius: 3px;\n  padding: 10px 14px;\n}\n.dos h4 {\n  font-family: var(--vc-font-mono);\n  font-weight: 700;\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  margin: 0 0 6px;\n}\n.dos .do  h4 { color: #3f5310; }\n.dos .dont h4 { color: var(--vc-rust); }\n.dos ul { margin: 0; padding-left: 16px; font-family: var(--vc-font-body); font-size: 11px; color: var(--vc-fg-soft); line-height: 1.55; }\n.dos li { margin: 2px 0; }\n\n/* footer ----------------------------------------------------- */\n.footer {\n  display: grid;\n  grid-template-columns: auto auto 1fr auto auto;\n  align-items: center;\n  gap: 22px;\n  padding: 14px 4px 0;\n  margin-top: 36px;\n  border-top: 1px solid var(--vc-rule);\n  font-family: var(--vc-font-mono);\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: .14em;\n  color: var(--vc-fg-mute);\n}\n.footer .vc-mark {\n  width: 30px; height: 30px;\n  border: 1px solid var(--vc-rule);\n  display: grid; place-items: center;\n  font-family: var(--vc-font-display); font-size: 12px;\n  color: var(--vc-teal); border-radius: 2px;\n}\n.footer .quote {\n  font-family: var(--vc-font-quote);\n  font-style: italic;\n  color: var(--vc-rust);\n  text-transform: none;\n  letter-spacing: 0;\n  font-size: 12px;\n  text-align: center;\n}\n.footer .quote em {\n  display: block;\n  color: var(--vc-fg-mute);\n  font-style: normal;\n  font-size: 9px;\n  margin-top: 2px;\n  letter-spacing: .08em;\n}\n.footer .face {\n  border: 1px solid var(--vc-rule);\n  border-radius: 2px;\n  padding: 2px 6px;\n  color: var(--vc-fg);\n  font-size: 12px;\n}\n\n/* ---- print ---- */\n@media print {\n  body { background: white; }\n  .bible { max-width: none; padding: 16mm; }\n  .section { break-inside: avoid; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n\n<body>\n<main class=\"bible\">\n  <span class=\"bible-corner-tr\"><\u002Fspan>\n  <span class=\"bible-corner-bl\"><\u002Fspan>\n\n  <div class=\"bible-stripe\">\n    <i style=\"background:#0e5547\"><\u002Fi>\n    <i style=\"background:#1aa080\"><\u002Fi>\n    <i style=\"background:#a3c33e\"><\u002Fi>\n    <i style=\"background:#c9892a\"><\u002Fi>\n    <i style=\"background:#b04a23\"><\u002Fi>\n    <i style=\"background:#8a5e7c\"><\u002Fi>\n    <i style=\"background:#6f7773\"><\u002Fi>\n  <\u002Fdiv>\n\n  <header class=\"masthead\">\n    <div class=\"wm\">\n      <span class=\"vc\">VIBE CODER<\u002Fspan>\n      <span class=\"slash\">//<\u002Fspan>\n      <span class=\"sub\">in-game design system<\u002Fspan>\n    <\u002Fdiv>\n    <div><\u002Fdiv>\n    <div class=\"pageno\">REV 0.9.1 // ALL SURFACES<\u002Fdiv>\n  <\u002Fheader>\n\n  <section class=\"hero\">\n    <h1>IN-GAME<br>DESIGN SYSTEM<\u002Fh1>\n    <span class=\"ribbon\">Set tokens. Compose surfaces. Trust the system.<\u002Fspan>\n    <p class=\"lede\">\n      Everything inside the game wears two hats. The chrome is cream-paper field-manual:\n      hairline borders, corner crosshairs, mono labels. The screens are CRT-dark phosphor:\n      scanlines, glow, VT323. This document is the contract between the two — colors,\n      type, panels, primitives, copy. If a surface ships, it is in here.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <nav class=\"toc\">\n    <div class=\"toc-label\">Table<br>of contents<\u002Fdiv>\n    <ol class=\"toc-list\">\n      <li><a href=\"#palette\"><span class=\"num\">01<\u002Fspan>Palette<\u002Fa><\u002Fli>\n      <li><a href=\"#type\"><span class=\"num\">02<\u002Fspan>Typography<\u002Fa><\u002Fli>\n      <li><a href=\"#space\"><span class=\"num\">03<\u002Fspan>Spacing &amp; borders<\u002Fa><\u002Fli>\n      <li><a href=\"#chrome\"><span class=\"num\">04<\u002Fspan>Panel chrome<\u002Fa><\u002Fli>\n      <li><a href=\"#hud\"><span class=\"num\">05<\u002Fspan>HUD primitives<\u002Fa><\u002Fli>\n      <li><a href=\"#policy\"><span class=\"num\">06<\u002Fspan>Policy &amp; ethics<\u002Fa><\u002Fli>\n      <li><a href=\"#auto\"><span class=\"num\">07<\u002Fspan>Autopilot &amp; speed<\u002Fa><\u002Fli>\n      <li><a href=\"#commits\"><span class=\"num\">08<\u002Fspan>Commit stream<\u002Fa><\u002Fli>\n      <li><a href=\"#events\"><span class=\"num\">09<\u002Fspan>Event grammar<\u002Fa><\u002Fli>\n      <li><a href=\"#world\"><span class=\"num\">10<\u002Fspan>World &amp; locations<\u002Fa><\u002Fli>\n      <li><a href=\"#tutorial\"><span class=\"num\">11<\u002Fspan>Tutorials &amp; toasts<\u002Fa><\u002Fli>\n      <li><a href=\"#modal\"><span class=\"num\">12<\u002Fspan>Modals &amp; end-states<\u002Fa><\u002Fli>\n      <li><a href=\"#icons\"><span class=\"num\">13<\u002Fspan>Iconography<\u002Fa><\u002Fli>\n      <li><a href=\"#motion\"><span class=\"num\">14<\u002Fspan>Motion<\u002Fa><\u002Fli>\n      <li><a href=\"#sound\"><span class=\"num\">15<\u002Fspan>Sound<\u002Fa><\u002Fli>\n      <li><a href=\"#a11y\"><span class=\"num\">16<\u002Fspan>Accessibility<\u002Fa><\u002Fli>\n    <\u002Fol>\n  <\u002Fnav>\n\n  <!-- ================================================\n       01 — PALETTE\n       ================================================ -->\n  <section class=\"section\" id=\"palette\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>01<\u002Fem>PALETTE<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">tokens · CRT phosphor · alert · status<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Paint chips, not gradients<\u002Fh2>\n    <p class=\"section-sub\">Flat. Muted. Amiga at dusk.<\u002Fp>\n    <div class=\"section-body\">\n      <p>Two surfaces, two palettes. Cream paper carries graphite ink and warm secondary chips.\n      CRT-dark phosphor carries teal-bright glow plus a fixed alert set. Never mix the two\n      grounds inside one panel — choose paper or screen and stay there.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Core paint chips<\u002Fspan><span class=\"meta\">paper-side · use as fills only<\u002Fspan><\u002Fdiv>\n        <div class=\"swatches\">\n          <div class=\"sw light\" style=\"background:#efe8d4\"><span class=\"hx\">#efe8d4<\u002Fspan><span class=\"nm\">paper<\u002Fspan><\u002Fdiv>\n          <div class=\"sw light\" style=\"background:#e6dcc1\"><span class=\"hx\">#e6dcc1<\u002Fspan><span class=\"nm\">paper warm<\u002Fspan><\u002Fdiv>\n          <div class=\"sw light\" style=\"background:#ddd4ba\"><span class=\"hx\">#ddd4ba<\u002Fspan><span class=\"nm\">paper cool<\u002Fspan><\u002Fdiv>\n          <div class=\"sw light\" style=\"background:#f4ecd6\"><span class=\"hx\">#f4ecd6<\u002Fspan><span class=\"nm\">cream<\u002Fspan><\u002Fdiv>\n          <div class=\"sw dark\" style=\"background:#16231f\"><span class=\"hx\">#16231f<\u002Fspan><span class=\"nm\">ink<\u002Fspan><\u002Fdiv>\n          <div class=\"sw dark\" style=\"background:#5b6660\"><span class=\"hx\">#5b6660<\u002Fspan><span class=\"nm\">ink mute<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>Brand &amp; status — paper-side<\u002Fspan><span class=\"meta\">borders + chips<\u002Fspan><\u002Fdiv>\n        <div class=\"swatches\" style=\"grid-template-columns: repeat(5, 1fr)\">\n          <div class=\"sw dark\" style=\"background:#0e5547\"><span class=\"hx\">#0e5547<\u002Fspan><span class=\"nm\">teal<\u002Fspan><\u002Fdiv>\n          <div class=\"sw dark\" style=\"background:#c9892a\"><span class=\"hx\">#c9892a<\u002Fspan><span class=\"nm\">amber<\u002Fspan><\u002Fdiv>\n          <div class=\"sw dark\" style=\"background:#b04a23\"><span class=\"hx\">#b04a23<\u002Fspan><span class=\"nm\">rust<\u002Fspan><\u002Fdiv>\n          <div class=\"sw dark\" style=\"background:#8a5e7c\"><span class=\"hx\">#8a5e7c<\u002Fspan><span class=\"nm\">mauve<\u002Fspan><\u002Fdiv>\n          <div class=\"sw dark\" style=\"background:#6f7773\"><span class=\"hx\">#6f7773<\u002Fspan><span class=\"nm\">stone<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>CRT phosphor — screen-side<\u002Fspan><span class=\"meta\">glow text only · never as fill<\u002Fspan><\u002Fdiv>\n        <div class=\"phosphor-row\" style=\"grid-template-columns: repeat(4, 1fr)\">\n          <div class=\"phosphor\" style=\"color:#1aa080; text-shadow: 0 0 6px rgba(26,160,128,.6)\">82.4%<small>info · #1aa080<\u002Fsmall><\u002Fdiv>\n          <div class=\"phosphor\" style=\"color:#a3c33e; text-shadow: 0 0 6px rgba(163,195,62,.6)\">+212<small>ok · #a3c33e<\u002Fsmall><\u002Fdiv>\n          <div class=\"phosphor\" style=\"color:#c9892a; text-shadow: 0 0 6px rgba(201,137,42,.6)\">DRIFT<small>warn · #c9892a<\u002Fsmall><\u002Fdiv>\n          <div class=\"phosphor\" style=\"color:#b04a23; text-shadow: 0 0 6px rgba(176,74,35,.6)\">BRK<small>risk · #b04a23<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Semantic tokens<\u002Fspan><span class=\"meta\">CSS variable → role → on-paper / on-screen<\u002Fspan><\u002Fdiv>\n        <table class=\"tok-table\">\n          <thead><tr><th style=\"width: 28%\">Token<\u002Fth><th>Role<\u002Fth><th>On paper<\u002Fth><th>On screen<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td><span class=\"swatch\" style=\"background:#16231f\"><\u002Fspan><code>--vc-fg<\u002Fcode><\u002Ftd><td class=\"role\">primary text<\u002Ftd><td>#16231f graphite ink<\u002Ftd><td>—<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#0e5547\"><\u002Fspan><code>--vc-accent<\u002Fcode><\u002Ftd><td class=\"role\">brand · titles · primary buttons<\u002Ftd><td>#0e5547 teal<\u002Ftd><td>—<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#1aa080\"><\u002Fspan><code>--vc-info<\u002Fcode> · <code>--vc-accent-on-screen<\u002Fcode><\u002Ftd><td class=\"role\">live state · neutral on-screen accent<\u002Ftd><td>—<\u002Ftd><td>#1aa080 teal-bright (glow)<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#a3c33e\"><\u002Fspan><code>--vc-ok<\u002Fcode><\u002Ftd><td class=\"role\">success · positive ethics · OSS<\u002Ftd><td>chip fill 22% alpha<\u002Ftd><td>#a3c33e acid (glow)<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#c9892a\"><\u002Fspan><code>--vc-warn<\u002Fcode><\u002Ftd><td class=\"role\">drift · degraded · time-limited<\u002Ftd><td>#c9892a amber<\u002Ftd><td>#c9892a amber (glow)<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#b04a23\"><\u002Fspan><code>--vc-risk<\u002Fcode><\u002Ftd><td class=\"role\">incident · CVE · breaking<\u002Ftd><td>#b04a23 rust<\u002Ftd><td>#b04a23 rust (glow)<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#8a5e7c\"><\u002Fspan><code>--vc-karma<\u002Fcode><\u002Ftd><td class=\"role\">karma · culture · political<\u002Ftd><td>#8a5e7c mauve<\u002Ftd><td>#8a5e7c mauve (glow)<\u002Ftd><\u002Ftr>\n            <tr><td><span class=\"swatch\" style=\"background:#0d1814\"><\u002Fspan><code>--vc-bg-screen<\u002Fcode><\u002Ftd><td class=\"role\">CRT ground<\u002Ftd><td>—<\u002Ftd><td>#0d1814 with scanlines<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       02 — TYPE\n       ================================================ -->\n  <section class=\"section\" id=\"type\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>02<\u002Fem>TYPOGRAPHY<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">pixelify · jetbrains mono · vt323 · special elite<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Four faces, no exceptions<\u002Fh2>\n    <p class=\"section-sub\">Display chunks. Mono labels. CRT glows. Quotes type.<\u002Fp>\n    <div class=\"section-body\">\n      <p>Display is Pixelify Sans for chunky paper-side titles. Body and labels are JetBrains\n      Mono. Anything that lives inside a CRT panel is VT323. Quotes and editorial asides are\n      Special Elite typewriter italic, in rust. Never use a system fallback for a hero — load\n      the real face or wait.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-8\">\n        <div class=\"spec-label\"><span>Display scale<\u002Fspan><span class=\"meta\">Pixelify Sans 700 · uppercase · letter-spacing 0.01em<\u002Fspan><\u002Fdiv>\n        <div class=\"type-line\">\n          <div class=\"meta\">D1 · 72 / 1<b>hero plate<\u002Fb><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family: var(--vc-font-display); font-weight:700; font-size:64px; line-height:1; color: var(--vc-teal); text-transform: uppercase\">Set rules<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-line\">\n          <div class=\"meta\">D2 · 52 / 1<b>section title<\u002Fb><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family: var(--vc-font-display); font-weight:700; font-size:46px; line-height:1; color: var(--vc-teal); text-transform: uppercase\">Watch systems evolve<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-line\">\n          <div class=\"meta\">D3 · 36 / 1<b>panel head<\u002Fb><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family: var(--vc-font-display); font-weight:600; font-size:32px; line-height:1; color: var(--vc-fg); text-transform: uppercase\">Sleep.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec span-4\">\n        <div class=\"spec-label\"><span>Type roles<\u002Fspan><span class=\"meta\">at a glance<\u002Fspan><\u002Fdiv>\n        <ul style=\"margin:0; padding-left:16px; font-family: var(--vc-font-body); font-size: 11.5px; color: var(--vc-fg-soft); line-height: 1.7;\">\n          <li><b>Display<\u002Fb> — Pixelify Sans, paper only, plate titles + hero metrics.<\u002Fli>\n          <li><b>Mono<\u002Fb> — JetBrains Mono, all chrome labels, body, code.<\u002Fli>\n          <li><b>CRT<\u002Fb> — VT323, exclusively inside a CRT screen.<\u002Fli>\n          <li><b>Quote<\u002Fb> — Special Elite italic, footer asides &amp; pull-quotes only.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Body &amp; labels (JetBrains Mono)<\u002Fspan><span class=\"meta\">letter-spacing 0.12em on uppercase labels<\u002Fspan><\u002Fdiv>\n        <div class=\"type-line\">\n          <div class=\"meta\">H1 · 28<b>card heading<\u002Fb><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family: var(--vc-font-display); font-weight: 600; font-size: 28px; color: var(--vc-fg); text-transform: uppercase; letter-spacing:.02em;\">Policy budget<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-line\">\n          <div class=\"meta\">H2 · 22<b>card sub<\u002Fb><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family: var(--vc-font-display); font-weight: 500; font-size: 22px; color: var(--vc-fg);\">Allocate 100 points across eight<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-line\">\n          <div class=\"meta\">H3 · 18 mono<b>field title<\u002Fb><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family: var(--vc-font-mono); font-weight: 700; font-size: 18px; color: var(--vc-fg);\">Tech debt window<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-line\">\n          <div class=\"meta\">Body · 14<b>paragraph<\u002Fb><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family: var(--vc-font-body); font-size: 14px; line-height:1.55; color: var(--vc-fg-soft);\">Most of the game is reading dashboards. Body type rewards skim — short lines, heavy hierarchy, no orphans.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-line\">\n          <div class=\"meta\">Small · 12<b>caption<\u002Fb><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family: var(--vc-font-body); font-size: 12px; color: var(--vc-fg-mute);\">Synced 14s ago · v0.9.1 · build 21847<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-line\">\n          <div class=\"meta\">Label · 10<b>tracked uppercase<\u002Fb><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family: var(--vc-font-mono); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--vc-fg-soft);\">Q3 · COMMIT STREAM · LIVE<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-8\">\n        <div class=\"spec-label\"><span>CRT body (VT323)<\u002Fspan><span class=\"meta\">on-screen only · text-shadow tinted by token<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-stage\">\n          <div style=\"font-family: var(--vc-font-crt); font-size: 28px; color: #c8e8d8; text-shadow: 0 0 6px rgba(26,160,128,.5); line-height: 1.2;\">\n            &gt; the plant compiles in 4m12s.<br>\n            &gt; brand 71%, ↑3 since friday.<br>\n            &gt; <span style=\"color:#a3c33e; text-shadow: 0 0 6px rgba(163,195,62,.5)\">3 patches landed.<\u002Fspan> <span style=\"color:#c9892a; text-shadow: 0 0 6px rgba(201,137,42,.5)\">1 drift detected.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec span-4\">\n        <div class=\"spec-label\"><span>Quote (Special Elite)<\u002Fspan><span class=\"meta\">italic · rust · use sparingly<\u002Fspan><\u002Fdiv>\n        <div style=\"background: var(--vc-paper-warm); border:1px solid var(--vc-rule); border-radius:3px; padding: 16px; font-family: var(--vc-font-quote); font-style: italic; color: var(--vc-rust); font-size: 16px; line-height: 1.5;\">\n          \"the best way to predict the future is to debug the present.\"\n          <em style=\"display:block; color: var(--vc-fg-mute); font-style: normal; font-size: 10px; margin-top: 8px; letter-spacing:.08em; text-transform: uppercase;\">— someone wiser than a founder<\u002Fem>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       03 — SPACE / BORDERS / SCANLINES\n       ================================================ -->\n  <section class=\"section\" id=\"space\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>03<\u002Fem>SPACING &amp; BORDERS<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">4px base · hairline rules · corner marks<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Hairlines, not boxes<\u002Fh2>\n    <p class=\"section-sub\">A 4px grid. A 1px line. A corner crosshair. Done.<\u002Fp>\n    <div class=\"section-body\">\n      <p>Spacing is a 4px base scale. Borders are 1px hairline graphite on paper, 1px translucent\n      cream on CRT. Corners get a \"+\" crosshair, never a colored stroke. Radii stay tiny:\n      paper 2–3px, screen 3–4px. If a panel needs more, it's two panels.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>Spacing scale<\u002Fspan><span class=\"meta\">--vc-space-1 → 9<\u002Fspan><\u002Fdiv>\n        <div class=\"ruler\">\n          <div class=\"step\" style=\"height: 4px\" data-val=\"2\" data-name=\"s1\"><\u002Fdiv>\n          <div class=\"step\" style=\"height: 8px\" data-val=\"4\" data-name=\"s2\"><\u002Fdiv>\n          <div class=\"step\" style=\"height: 14px\" data-val=\"8\" data-name=\"s3\"><\u002Fdiv>\n          <div class=\"step\" style=\"height: 20px\" data-val=\"12\" data-name=\"s4\"><\u002Fdiv>\n          <div class=\"step\" style=\"height: 26px\" data-val=\"16\" data-name=\"s5\"><\u002Fdiv>\n          <div class=\"step\" style=\"height: 36px\" data-val=\"24\" data-name=\"s6\"><\u002Fdiv>\n          <div class=\"step\" style=\"height: 46px\" data-val=\"32\" data-name=\"s7\"><\u002Fdiv>\n          <div class=\"step\" style=\"height: 56px\" data-val=\"48\" data-name=\"s8\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"spec-note\">Use s3/s4 inside panels, s5/s6 between cards, s7/s8 between sections.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-3\">\n        <div class=\"spec-label\"><span>Radius<\u002Fspan><span class=\"meta\">px<\u002Fspan><\u002Fdiv>\n        <div class=\"radii\">\n          <div class=\"rad\" style=\"border-radius: 0;\">0<\u002Fdiv>\n          <div class=\"rad\" style=\"border-radius: 2px;\">2<\u002Fdiv>\n          <div class=\"rad\" style=\"border-radius: 4px;\">4<\u002Fdiv>\n          <div class=\"rad\" style=\"border-radius: 6px;\">6<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-3\">\n        <div class=\"spec-label\"><span>Border lines<\u002Fspan><span class=\"meta\">don't go bigger<\u002Fspan><\u002Fdiv>\n        <div class=\"borderpins\">\n          <div class=\"pin hair\">hair · 1px<\u002Fdiv>\n          <div class=\"pin soft\">soft · 1px<\u002Fdiv>\n          <div class=\"pin dash\">dash · 1px<\u002Fdiv>\n          <div class=\"pin thick\">thick · 2px (titles)<\u002Fdiv>\n          <div class=\"pin crt\">CRT · 1px ✕ .25 alpha<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>Corner marks<\u002Fspan><span class=\"meta\">\"+\" crosshair · 14px mono<\u002Fspan><\u002Fdiv>\n        <div class=\"cornermark-demo\">\n          <span class=\"corner-tl\"><\u002Fspan>\n          <span class=\"corner-bl\"><\u002Fspan>\n          Every paper-side panel gets four \"+\" marks. Inset 6–12px from the corner. Mono, ink-rule color, 14px.\n        <\u002Fdiv>\n        <div class=\"spec-note\">Never replace with a stroke, glow, or icon. The crosshair is part of the brand voice.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>Scanlines<\u002Fspan><span class=\"meta\">three intensities<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;\">\n          <div class=\"scanline-demo l1\"><span class=\"lab\">L1 · LOW<\u002Fspan><\u002Fdiv>\n          <div class=\"scanline-demo l2\"><span class=\"lab\">L2 · DEFAULT<\u002Fspan><\u002Fdiv>\n          <div class=\"scanline-demo l3\"><span class=\"lab\">L3 · LOUD<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"spec-note\">L1 for long-read screens (commits, logs). L2 for HUD &amp; gameplay. L3 only for end-state cinematics.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>Shadow + bezel<\u002Fspan><span class=\"meta\">paper · screen<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n          <div style=\"background: var(--vc-bg-elev); border: 1px solid var(--vc-rule); border-radius: 3px; padding: 16px; box-shadow: var(--vc-shadow-card); font-family: var(--vc-font-mono); font-size: 11px; color: var(--vc-fg);\">\n            paper card<br><span style=\"color: var(--vc-fg-mute); font-size: 10px;\">--vc-shadow-card · 1px graphite drop<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"spec-stage\" style=\"padding: 16px; box-shadow: var(--vc-shadow-crt-bezel);\">\n            <div style=\"font-family: var(--vc-font-crt); font-size: 16px; color: var(--vc-fg-on-screen);\">CRT bezel · inset 4px<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>DO / DON'T<\u002Fspan><span class=\"meta\">borders + shadows<\u002Fspan><\u002Fdiv>\n        <div class=\"dos\">\n          <div class=\"col do\"><h4>▸ Do<\u002Fh4><ul>\n            <li>Stack hairlines.<\u002Fli>\n            <li>Use 1px dashed lines as in-panel section breaks.<\u002Fli>\n            <li>Let corner marks sit unstyled.<\u002Fli>\n          <\u002Ful><\u002Fdiv>\n          <div class=\"col dont\"><h4>▸ Don't<\u002Fh4><ul>\n            <li>Use drop shadows greater than 4px on paper.<\u002Fli>\n            <li>Round corners past 6px.<\u002Fli>\n            <li>Tint borders. Hairlines are graphite, period.<\u002Fli>\n          <\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       04 — PANEL CHROME\n       ================================================ -->\n  <section class=\"section\" id=\"chrome\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>04<\u002Fem>PANEL CHROME<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">title strip · status pip · dashed divider<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">The bordered surface<\u002Fh2>\n    <p class=\"section-sub\">Title strip top. Pip top-right. Dashed divider below. Body.<\u002Fp>\n    <div class=\"section-body\">\n      <p>Every CRT panel is the same shape: 1px translucent cream border, 4px radius, padding 12px.\n      Title strip sits at the top in tracked mono — the panel says what it is. Optional live pip\n      (acid green) sits flush right. A dashed line separates the title strip from the body.\n      That's it. No accent bars, no headers with icons, no progress meters in the title.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-4 spec-stage\">\n        <div class=\"spec-label\" style=\"color: var(--vc-fg-on-screen-mute); border-color: rgba(200,232,216,.22);\"><span style=\"color: var(--vc-fg-on-screen)\">Default panel<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">no live state<\u002Fspan><\u002Fdiv>\n        <div class=\"panel-demo\">\n          <div class=\"panel-demo-head\">\n            <span class=\"panel-demo-title\">SYSTEM · SUMMARY<\u002Fspan>\n            <span style=\"font-family: var(--vc-font-mono); font-size: 9px; color: var(--vc-fg-on-screen-mute); letter-spacing: .14em\">Q3<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"row\"><span>Tech debt<\u002Fspan><span class=\"v\">14.2k<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span
