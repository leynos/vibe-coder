>Brand aura<\u002Fspan><span class=\"v\">71%<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span>Fleet load<\u002Fspan><span class=\"v\">62%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-4 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Live panel<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">+ LIVE pip<\u002Fspan><\u002Fdiv>\n        <div class=\"panel-demo\">\n          <div class=\"panel-demo-head\">\n            <span class=\"panel-demo-title\">COMMIT STREAM<\u002Fspan>\n            <span class=\"live\">+ LIVE<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"row\"><span>agent/karma<\u002Fspan><span class=\"v\">+38<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span>agent/build<\u002Fspan><span class=\"v\">+212<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span>agent/lint<\u002Fspan><span class=\"v\">+9<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-4 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Risk panel<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">degraded state<\u002Fspan><\u002Fdiv>\n        <div class=\"panel-demo\" style=\"border-color: var(--vc-rust);\">\n          <div class=\"panel-demo-head\" style=\"border-bottom-color: rgba(176,74,35,.5)\">\n            <span class=\"panel-demo-title\" style=\"color: #e08a6a\">CVE · ACTIVE<\u002Fspan>\n            <span style=\"font-family: var(--vc-font-mono); font-size: 9px; color: #e08a6a; letter-spacing: .14em; text-shadow: 0 0 4px rgba(176,74,35,.6)\">! BREAK<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"row\"><span>Severity<\u002Fspan><span class=\"v\" style=\"color: #e08a6a; text-shadow: 0 0 6px rgba(176,74,35,.6)\">9.1 / 10<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span>Window<\u002Fspan><span class=\"v\" style=\"color: var(--vc-amber); text-shadow: 0 0 6px rgba(201,137,42,.5)\">06:14<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Anatomy<\u002Fspan><span class=\"meta\">read top-to-bottom<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th style=\"width: 22%\">Slot<\u002Fth><th style=\"width: 22%\">Token<\u002Fth><th>Spec<\u002Fth><th>Notes<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">title strip<\u002Ftd><td class=\"v\">JetBrains Mono 700 · 11px · LS .16em UPPER<\u002Ftd><td>Color <code>--vc-fg-on-screen<\u002Fcode><\u002Ftd><td class=\"w\">Reserved noun. No verbs, no emoji.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">pip · live<\u002Ftd><td class=\"v\">JetBrains Mono · 10px · LS .14em<\u002Ftd><td>Color <code>--vc-acid<\u002Fcode> + glow<\u002Ftd><td class=\"w\">\"+ LIVE\", \"+ ACTIVE\", \"+ STREAM\". Drop the prefix offline.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">divider<\u002Ftd><td class=\"v\">1px dashed<\u002Ftd><td>rgba(200,232,216,.22)<\u002Ftd><td class=\"w\">Bottom of title strip only. Never inside body.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">body padding<\u002Ftd><td class=\"v\">12px<\u002Ftd><td>top/bottom + left/right<\u002Ftd><td class=\"w\">If you need more, you have the wrong density.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">border<\u002Ftd><td class=\"v\">1px solid<\u002Ftd><td>rgba(200,232,216,.22) · radius 4px<\u002Ftd><td class=\"w\">Risk variant: <code>--vc-rust<\u002Fcode>. Karma: <code>--vc-mauve<\u002Fcode>.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       05 — HUD PRIMITIVES\n       ================================================ -->\n  <section class=\"section\" id=\"hud\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>05<\u002Fem>HUD PRIMITIVES<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">stat · seg · slider · toggle<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Read-outs you can scan in 200ms<\u002Fh2>\n    <p class=\"section-sub\">Label tracked. Value glowing. Delta dimmed.<\u002Fp>\n    <div class=\"section-body\">\n      <p>Stats are the smallest readable unit. Always three layers: <code>label<\u002Fcode> in tracked\n      mono mute, <code>value<\u002Fcode> in VT323 phosphor, <code>delta<\u002Fcode> in tracked mono dim.\n      Segmented controls and toggles share one rail height (28px) so they line up.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-12 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Stat read-out<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">five tones<\u002Fspan><\u002Fdiv>\n        <div class=\"hud-grid\" style=\"grid-template-columns: repeat(5, 1fr);\">\n          <div class=\"stat ok\"><div class=\"lbl\">Brand<\u002Fdiv><div class=\"val\">71%<\u002Fdiv><div class=\"delta\" style=\"color:#a3c33e\">↑ 3<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat info\"><div class=\"lbl\">Compute<\u002Fdiv><div class=\"val\">62%<\u002Fdiv><div class=\"delta\" style=\"color:#1aa080\">— 0<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat warn\"><div class=\"lbl\">Drift<\u002Fdiv><div class=\"val\">DRIFT<\u002Fdiv><div class=\"delta\" style=\"color:#c9892a\">↑ 0.4<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat risk\"><div class=\"lbl\">CVE<\u002Fdiv><div class=\"val\">9.1<\u002Fdiv><div class=\"delta\" style=\"color:#b04a23\">! 06:14<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat karma\"><div class=\"lbl\">Karma<\u002Fdiv><div class=\"val\">B+<\u002Fdiv><div class=\"delta\" style=\"color:#c39ab8\">↓ 1<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Segmented · speed<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">2–4 cells max<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div class=\"seg\">\n            <button class=\"seg-btn\">II<\u002Fbutton>\n            <button class=\"seg-btn on\">1×<\u002Fbutton>\n            <button class=\"seg-btn\">2×<\u002Fbutton>\n            <button class=\"seg-btn\">4×<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"seg\">\n            <button class=\"seg-btn on\">DAY<\u002Fbutton>\n            <button class=\"seg-btn\">WEEK<\u002Fbutton>\n            <button class=\"seg-btn\">QTR<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Slider<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">teal-bright fill<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; gap: 6px;\">\n          <div class=\"slider\"><span>Ship<\u002Fspan><div class=\"track\"><div class=\"fill\" style=\"width: 35%\"><\u002Fdiv><\u002Fdiv><span class=\"pct\">35<\u002Fspan><\u002Fdiv>\n          <div class=\"slider\"><span>Quality<\u002Fspan><div class=\"track\"><div class=\"fill\" style=\"width: 55%\"><\u002Fdiv><\u002Fdiv><span class=\"pct\">55<\u002Fspan><\u002Fdiv>\n          <div class=\"slider\"><span>Research<\u002Fspan><div class=\"track\"><div class=\"fill\" style=\"width: 12%\"><\u002Fdiv><\u002Fdiv><span class=\"pct\">12<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Toggle pills<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">on · off · warn-on<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n          <span class=\"tog on\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">no dark patterns<\u002Fspan><\u002Fspan>\n          <span class=\"tog on\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">disclose CVEs<\u002Fspan><\u002Fspan>\n          <span class=\"tog\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">accept piracy<\u002Fspan><\u002Fspan>\n          <span class=\"tog warn on\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">accept fossil power<\u002Fspan><\u002Fspan>\n          <span class=\"tog\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">paywall research<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       06 — POLICY + ETHICS\n       ================================================ -->\n  <section class=\"section\" id=\"policy\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>06<\u002Fem>POLICY &amp; ETHICS<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">8-way budget · 4 commitments · grade<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">100 points. Eight categories.<\u002Fh2>\n    <p class=\"section-sub\">Move one slider. Watch the others recoil.<\u002Fp>\n    <div class=\"section-body\">\n      <p>The policy budget is the spine of the game. Eight sliders, 100 total, integer steps.\n      Drag one, the others shed proportionally — never silently, never to zero. Commitments\n      are binary toggles outside the budget. Their count maps to a letter grade A–F. Grade\n      affects trust, recruiting, and which events fire.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-7 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Policy panel — full<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">8 sliders sum to 100<\u002Fspan><\u002Fdiv>\n        <div class=\"panel-demo\">\n          <div class=\"panel-demo-head\"><span class=\"panel-demo-title\">POLICY · BUDGET<\u002Fspan><span style=\"color: var(--vc-fg-on-screen-mute); font-size: 10px; font-family: var(--vc-font-mono); letter-spacing: .14em;\">Σ 100<\u002Fspan><\u002Fdiv>\n          <div class=\"policy-list\">\n            <div class=\"policy-row\"><span class=\"policy-name\"><span class=\"glyph\">▸<\u002Fspan><span>SHIP<\u002Fspan><\u002Fspan><div class=\"policy-track\"><div class=\"policy-fill\" style=\"width: 35%\"><\u002Fdiv><\u002Fdiv><span class=\"policy-pct\">35<\u002Fspan><\u002Fdiv>\n            <div class=\"policy-row\"><span class=\"policy-name\"><span class=\"glyph\">⌬<\u002Fspan><span>OSS<\u002Fspan><\u002Fspan><div class=\"policy-track\"><div class=\"policy-fill\" style=\"width: 15%\"><\u002Fdiv><\u002Fdiv><span class=\"policy-pct\">15<\u002Fspan><\u002Fdiv>\n            <div class=\"policy-row\"><span class=\"policy-name\"><span class=\"glyph\">◇<\u002Fspan><span>QUALITY<\u002Fspan><\u002Fspan><div class=\"policy-track\"><div class=\"policy-fill\" style=\"width: 15%\"><\u002Fdiv><\u002Fdiv><span class=\"policy-pct\">15<\u002Fspan><\u002Fdiv>\n            <div class=\"policy-row\"><span class=\"policy-name\"><span class=\"glyph\">⚿<\u002Fspan><span>SECURITY<\u002Fspan><\u002Fspan><div class=\"policy-track\"><div class=\"policy-fill\" style=\"width: 10%\"><\u002Fdiv><\u002Fdiv><span class=\"policy-pct\">10<\u002Fspan><\u002Fdiv>\n            <div class=\"policy-row\"><span class=\"policy-name\"><span class=\"glyph\">∿<\u002Fspan><span>RESEARCH<\u002Fspan><\u002Fspan><div class=\"policy-track\"><div class=\"policy-fill\" style=\"width: 10%\"><\u002Fdiv><\u002Fdiv><span class=\"policy-pct\">10<\u002Fspan><\u002Fdiv>\n            <div class=\"policy-row\"><span class=\"policy-name\"><span class=\"glyph\">○<\u002Fspan><span>MARKETING<\u002Fspan><\u002Fspan><div class=\"policy-track\"><div class=\"policy-fill\" style=\"width: 7%\"><\u002Fdiv><\u002Fdiv><span class=\"policy-pct\">7<\u002Fspan><\u002Fdiv>\n            <div class=\"policy-row\"><span class=\"policy-name\"><span class=\"glyph\">◫<\u002Fspan><span>CIVIC<\u002Fspan><\u002Fspan><div class=\"policy-track\"><div class=\"policy-fill\" style=\"width: 5%\"><\u002Fdiv><\u002Fdiv><span class=\"policy-pct\">5<\u002Fspan><\u002Fdiv>\n            <div class=\"policy-row\"><span class=\"policy-name\"><span class=\"glyph\">⚡<\u002Fspan><span>POWER<\u002Fspan><\u002Fspan><div class=\"policy-track\"><div class=\"policy-fill\" style=\"width: 3%\"><\u002Fdiv><\u002Fdiv><span class=\"policy-pct\">3<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"policy-foot\"><span class=\"ok\">▸ BALANCED<\u002Fspan><span>BUDGET LOCKED — Q3<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-5 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Ethics panel<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">4 → grade<\u002Fspan><\u002Fdiv>\n        <div class=\"panel-demo\">\n          <div class=\"panel-demo-head\"><span class=\"panel-demo-title\">ETHICS · COMMITMENTS<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; gap: 6px;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; font-family: var(--vc-font-crt); font-size: 13px; color: var(--vc-fg-on-screen)\"><span>No dark patterns<\u002Fspan><span class=\"tog on\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">on<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; align-items: center; font-family: var(--vc-font-crt); font-size: 13px; color: var(--vc-fg-on-screen)\"><span>Disclose CVEs<\u002Fspan><span class=\"tog on\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">on<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; align-items: center; font-family: var(--vc-font-crt); font-size: 13px; color: var(--vc-fg-on-screen)\"><span>Reject piracy<\u002Fspan><span class=\"tog on\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">on<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; align-items: center; font-family: var(--vc-font-crt); font-size: 13px; color: var(--vc-fg-on-screen)\"><span>Reject fossil power<\u002Fspan><span class=\"tog\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">off<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 12px; padding: 8px 10px; border: 1px solid rgba(200,232,216,.22); border-radius: 3px; display: flex; justify-content: space-between; align-items: center;\">\n            <span style=\"font-family: var(--vc-font-mono); font-size: 10px; letter-spacing: .14em; color: var(--vc-fg-on-screen-mute)\">CURRENT GRADE<\u002Fspan>\n            <span style=\"font-family: var(--vc-font-display); font-size: 26px; color: var(--vc-acid); text-shadow: 0 0 8px rgba(163,195,62,.5); line-height: 1;\">B<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top: 8px; font-family: var(--vc-font-mono); font-size: 10px; letter-spacing: .12em; color: var(--vc-fg-on-screen-mute)\">3/4 ON — TRUST <strong style=\"color: var(--vc-acid); font-weight: 700;\">+12%<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Grade math<\u002Fspan><span class=\"meta\">deterministic<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th>Commitments on<\u002Fth><th>Grade<\u002Fth><th>Trust mod<\u002Fth><th>Available events<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">4<\u002Ftd><td class=\"v\">A<\u002Ftd><td class=\"v\">+18%<\u002Ftd><td class=\"w\">All. \"Patron\" cards unlock at A for two consecutive quarters.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">3<\u002Ftd><td class=\"v\">B<\u002Ftd><td class=\"v\">+12%<\u002Ftd><td class=\"w\">All except \"patron\". Most political events fire.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">2<\u002Ftd><td class=\"v\">C<\u002Ftd><td class=\"v\">±0%<\u002Ftd><td class=\"w\">All. Mixed press.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">1<\u002Ftd><td class=\"v\">D<\u002Ftd><td class=\"v\">−8%<\u002Ftd><td class=\"w\">All + \"rogue agent\" risk pool.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">0<\u002Ftd><td class=\"v\">F<\u002Ftd><td class=\"v\">−18%<\u002Ftd><td class=\"w\">All + \"regulator\" pool. PMF ceiling capped at 60%.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       07 — AUTOPILOT\n       ================================================ -->\n  <section class=\"section\" id=\"auto\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>07<\u002Fem>AUTOPILOT &amp; SPEED<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">mode picker · transport · gate<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Drive. Glide. Sleep.<\u002Fh2>\n    <p class=\"section-sub\">Three modes. Four speeds. One pause that means it.<\u002Fp>\n    <div class=\"section-body\">\n      <p>The autopilot is not a difficulty slider. It is a contract about how often the player is\n      asked to act. Manual demands input every event. Adaptive forwards routine decisions and\n      stops on novelty. Sleep clears your inbox of anything below severity 4 — the game runs\n      the night shift while you log off.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-6 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Mode picker<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">radio · single-select<\u002Fspan><\u002Fdiv>\n        <div class=\"panel-demo\">\n          <div class=\"panel-demo-head\"><span class=\"panel-demo-title\">AUTOPILOT<\u002Fspan><span style=\"color: var(--vc-acid); font-family: var(--vc-font-mono); font-size: 10px; letter-spacing: .14em; text-shadow: 0 0 6px rgba(163,195,62,.4);\">+ ADAPTIVE<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; gap: 6px;\">\n            <div style=\"display: grid; grid-template-columns: 14px 1fr; gap: 8px; padding: 6px 8px; border-radius: 3px;\">\n              <span style=\"grid-row: 1 / 3; align-self: center; width: 9px; height: 9px; border-radius: 999px; border: 1px solid var(--vc-fg-on-screen-mute);\"><\u002Fspan>\n              <div>\n                <div style=\"font-family: var(--vc-font-crt); font-size: 14px; color: var(--vc-fg-on-screen)\">MANUAL<\u002Fdiv>\n                <div style=\"font-family: var(--vc-font-mono); font-size: 9px; color: var(--vc-fg-on-screen-mute); letter-spacing: .12em\">EVERY EVENT PAUSES<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 14px 1fr; gap: 8px; padding: 6px 8px; border: 1px solid rgba(200,232,216,.22); background: rgba(0,0,0,.25); border-radius: 3px;\">\n              <span style=\"grid-row: 1 / 3; align-self: center; width: 9px; height: 9px; border-radius: 999px; background: var(--vc-acid); box-shadow: 0 0 6px rgba(163,195,62,.6);\"><\u002Fspan>\n              <div>\n                <div style=\"font-family: var(--vc-font-crt); font-size: 14px; color: var(--vc-fg-on-screen)\">ADAPTIVE<\u002Fdiv>\n                <div style=\"font-family: var(--vc-font-mono); font-size: 9px; color: var(--vc-fg-on-screen-mute); letter-spacing: .12em\">FORWARDS ROUTINE · STOPS ON NOVELTY<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 14px 1fr; gap: 8px; padding: 6px 8px; border-radius: 3px;\">\n              <span style=\"grid-row: 1 / 3; align-self: center; width: 9px; height: 9px; border-radius: 999px; border: 1px solid var(--vc-fg-on-screen-mute);\"><\u002Fspan>\n              <div>\n                <div style=\"font-family: var(--vc-font-crt); font-size: 14px; color: var(--vc-fg-on-screen)\">SLEEP<\u002Fdiv>\n                <div style=\"font-family: var(--vc-font-mono); font-size: 9px; color: var(--vc-fg-on-screen-mute); letter-spacing: .12em\">SEV ≥ 4 ONLY · NIGHT SHIFT<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Transport<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">II · 1× · 2× · 4×<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 24px; display: grid; gap: 14px;\">\n          <div style=\"display: flex; gap: 4px;\">\n            <button style=\"width: 36px; height: 32px; background: rgba(255,255,255,.04); border: 1px solid rgba(200,232,216,.25); border-radius: 3px; color: var(--vc-fg-on-screen); font-family: var(--vc-font-crt); font-size: 16px; cursor: pointer;\">II<\u002Fbutton>\n            <button style=\"width: 36px; height: 32px; background: var(--vc-teal-dark); border: 1px solid var(--vc-teal-bright); border-radius: 3px; color: var(--vc-acid); font-family: var(--vc-font-crt); font-size: 16px; text-shadow: 0 0 6px rgba(163,195,62,.6); cursor: pointer;\">1×<\u002Fbutton>\n            <button style=\"width: 36px; height: 32px; background: rgba(255,255,255,.04); border: 1px solid rgba(200,232,216,.25); border-radius: 3px; color: var(--vc-fg-on-screen); font-family: var(--vc-font-crt); font-size: 16px; cursor: pointer;\">2×<\u002Fbutton>\n            <button style=\"width: 36px; height: 32px; background: rgba(255,255,255,.04); border: 1px solid rgba(200,232,216,.25); border-radius: 3px; color: var(--vc-fg-on-screen); font-family: var(--vc-font-crt); font-size: 16px; cursor: pointer;\">4×<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-family: var(--vc-font-mono); font-size: 10px; letter-spacing: .14em; color: var(--vc-fg-on-screen-mute); text-transform: uppercase;\">\n            Pause is binary. 1× is \"real\". 2× and 4× compress the simulation tick — events still fire, prompts still pause.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Pause contract<\u002Fspan><span class=\"meta\">no exceptions<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th>Trigger<\u002Fth><th>Manual<\u002Fth><th>Adaptive<\u002Fth><th>Sleep<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">Sev 1 · routine<\u002Ftd><td class=\"v\">Pause<\u002Ftd><td class=\"v\">Auto-resolve · log<\u002Ftd><td class=\"v\">Auto · silent<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">Sev 2 · drift<\u002Ftd><td class=\"v\">Pause<\u002Ftd><td class=\"v\">Auto-resolve · log<\u002Ftd><td class=\"v\">Auto · silent<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">Sev 3 · novel pattern<\u002Ftd><td class=\"v\">Pause<\u002Ftd><td class=\"v\">Pause<\u002Ftd><td class=\"v\">Queue · digest<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">Sev 4 · incident<\u002Ftd><td class=\"v\">Pause<\u002Ftd><td class=\"v\">Pause<\u002Ftd><td class=\"v\">Pause + alarm<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">Sev 5 · catastrophic<\u002Ftd><td class=\"v\">Pause<\u002Ftd><td class=\"v\">Pause<\u002Ftd><td class=\"v\">Pause + alarm + wake<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       08 — COMMIT STREAM\n       ================================================ -->\n  <section class=\"section\" id=\"commits\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>08<\u002Fem>COMMIT STREAM<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">activity log · phosphor green · who + delta<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">The night shift, narrated<\u002Fh2>\n    <p class=\"section-sub\">Two columns. No icons. No timestamps. Read or scroll past.<\u002Fp>\n    <div class=\"section-body\">\n      <p>The commit stream is one of the few surfaces where motion is allowed. Rows shift up\n      every 6s. Each row is <code>who<\u002Fcode> on the left, <code>delta<\u002Fcode> on the right.\n      Color carries the verdict — acid for normal, amber for warnings, rust for breaks.\n      Never name the action (\"created\", \"merged\"). The agent's branch name says enough.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-6 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Default stream<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">7 rows · 6s tick<\u002Fspan><\u002Fdiv>\n        <div class=\"panel-demo\">\n          <div class=\"panel-demo-head\"><span class=\"panel-demo-title\">COMMIT STREAM<\u002Fspan><span class=\"live\">+ LIVE<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 2px; min-height: 154px;\">\n            <div class=\"commit\"><span class=\"who\">agent/karma-auditor<\u002Fspan><span class=\"delta\">+38<\u002Fspan><\u002Fdiv>\n            <div class=\"commit\"><span class=\"who\">agent/build-cache<\u002Fspan><span class=\"delta\">+212<\u002Fspan><\u002Fdiv>\n            <div class=\"commit\"><span class=\"who\">agent/lint<\u002Fspan><span class=\"delta\">+9<\u002Fspan><\u002Fdiv>\n            <div class=\"commit\"><span class=\"who\">agent/cve-watch<\u002Fspan><span class=\"delta\">+1<\u002Fspan><\u002Fdiv>\n            <div class=\"commit\"><span class=\"who\">agent/oss-merge<\u002Fspan><span class=\"delta\">+71<\u002Fspan><\u002Fdiv>\n            <div class=\"commit\"><span class=\"who\">agent/research<\u002Fspan><span class=\"delta\">+4<\u002Fspan><\u002Fdiv>\n            <div class=\"commit\"><span class=\"who\">agent/civic-audit<\u002Fspan><span class=\"delta\">+18<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Mixed verdicts<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">ok / warn / risk<\u002Fspan><\u002Fdiv>\n        <div class=\"panel-demo\">\n          <div class=\"panel-demo-head\"><span class=\"panel-demo-title\">COMMIT STREAM · DEGRADED<\u002Fspan><span style=\"color: var(--vc-amber); font-family: var(--vc-font-mono); font-size: 10px; letter-spacing: .14em; text-shadow: 0 0 6px rgba(201,137,42,.4)\">+ DRIFT<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 2px; min-height: 154px;\">\n            <div class=\"commit\"><span class=\"who\">agent/build-cache<\u002Fspan><span class=\"delta\">+212<\u002Fspan><\u002Fdiv>\n            <div class=\"commit warn\"><span class=\"who\">agent/karma-drift<\u002Fspan><span class=\"delta\">−14<\u002Fspan><\u002Fdiv>\n            <div class=\"commit\"><span class=\"who\">agent/lint<\u002Fspan><span class=\"delta\">+9<\u002Fspan><\u002Fdiv>\n            <div class=\"commit risk\"><span class=\"who\">agent/cve-watch<\u002Fspan><span class=\"delta\">!! CVE-9.1<\u002Fspan><\u002Fdiv>\n            <div class=\"commit\"><span class=\"who\">agent/oss-merge<\u002Fspan><span class=\"delta\">+71<\u002Fspan><\u002Fdiv>\n            <div class=\"commit warn\"><span class=\"who\">agent/quality-spot<\u002Fspan><span class=\"delta\">drift 0.4<\u002Fspan><\u002Fdiv>\n            <div class=\"commit\"><span class=\"who\">agent/civic-audit<\u002Fspan><span class=\"delta\">+18<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Naming rules<\u002Fspan><span class=\"meta\">left column<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th>Pattern<\u002Fth><th>Meaning<\u002Fth><th>Color<\u002Fth><th>Notes<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\"><code>agent/&lt;noun&gt;<\u002Fcode><\u002Ftd><td class=\"w\">A standing agent's branch<\u002Ftd><td class=\"v\">acid<\u002Ftd><td class=\"w\">Always one noun, kebab-case. Never verbs.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\"><code>agent/&lt;noun&gt;-drift<\u002Fcode><\u002Ftd><td class=\"w\">An agent drifting from spec<\u002Ftd><td class=\"v\">amber<\u002Ftd><td class=\"w\">Append <code>-drift<\u002Fcode> never invent new suffixes.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\"><code>agent/cve-watch<\u002Fcode><\u002Ftd><td class=\"w\">Vulnerability monitor<\u002Ftd><td class=\"v\">rust on hit, acid otherwise<\u002Ftd><td class=\"w\">Reserved name. Always present.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\"><code>player/&lt;intent&gt;<\u002Fcode><\u002Ftd><td class=\"w\">A direct override the player issued<\u002Ftd><td class=\"v\">teal-bright<\u002Ftd><td class=\"w\">Distinguishes human action from agent action.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       09 — EVENT GRAMMAR\n       ================================================ -->\n  <section class=\"section\" id=\"events\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>09<\u002Fem>EVENT GRAMMAR<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">risk · opportunity · incident · political<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Four kinds. Same shape.<\u002Fh2>\n    <p class=\"section-sub\">Dot. Time. Title. Two-line body. Tag.<\u002Fp>\n    <div class=\"section-body\">\n      <p>Every event card looks identical except for one chip: the dot color and the bottom-left\n      tag. This consistency is load-bearing — players learn the shape, then read the chip. The\n      title is a noun phrase, the body explains the consequence in two short sentences, the tag\n      is the kind in tracked uppercase.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-12 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">All four kinds<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">dot · tag<\u002Fspan><\u002Fdiv>\n        <div class=\"event-row\">\n          <div class=\"evcard kind-risk\">\n            <span class=\"dot\"><\u002Fspan>\n            <div class=\"time\">06:14<\u002Fdiv>\n            <div class=\"ttl\">CONFIG DRIFT OUTAGE<\u002Fdiv>\n            <div class=\"desc\">Reliability buckles under invisible entropy. Trust leaks out.<\u002Fdiv>\n            <div class=\"tag\">RISK<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"evcard kind-opp\">\n            <span class=\"dot\"><\u002Fspan>\n            <div class=\"time\">14:02<\u002Fdiv>\n            <div class=\"ttl\">VIRAL OSS MOMENT<\u002Fdiv>\n            <div class=\"desc\">Community arrives and debt starts melting. Window: 3 days.<\u002Fdiv>\n            <div class=\"tag\">OPPORTUNITY<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"evcard kind-warn\">\n            <span class=\"dot\"><\u002Fspan>\n            <div class=\"time\">22:47<\u002Fdiv>\n            <div class=\"ttl\">MISALIGNMENT SCARE<\u002Fdiv>\n            <div class=\"desc\">Agents helpfully reinterpret your values. Rollback available.<\u002Fdiv>\n            <div class=\"tag\">INCIDENT<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"evcard kind-pol\">\n            <span class=\"dot\"><\u002Fspan>\n            <div class=\"time\">Q3.W4<\u002Fdiv>\n            <div class=\"ttl\">POLITICS PIVOT<\u002Fdiv>\n            <div class=\"desc\">UBI, universal services, or grubby influence. Pick one.<\u002Fdiv>\n            <div class=\"tag\">POLITICAL<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Anatomy<\u002Fspan><span class=\"meta\">five slots, fixed<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th style=\"width: 16%\">Slot<\u002Fth><th style=\"width: 22%\">Spec<\u002Fth><th>Rules<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">dot<\u002Ftd><td class=\"v\">8px circle · top-left · glow<\u002Ftd><td class=\"w\">One per kind. Never skip.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">time<\u002Ftd><td class=\"v\">VT323 13px mute<\u002Ftd><td class=\"w\"><code>HH:MM<\u002Fcode> for in-day; <code>Qn.Wn<\u002Fcode> for political. Never relative (\"3 min ago\").<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">title<\u002Ftd><td class=\"v\">Mono 700 · 11px · LS .04em UPPER<\u002Ftd><td class=\"w\">Noun phrase. 2–4 words. No punctuation.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">desc<\u002Ftd><td class=\"v\">VT323 13px mute · clamp 2 lines<\u002Ftd><td class=\"w\">Two sentences max. Voice stays declarative — three beats if you can.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">tag<\u002Ftd><td class=\"v\">Mono · 9px · LS .14em UPPER<\u002Ftd><td class=\"w\">Always one of: RISK · OPPORTUNITY · INCIDENT · POLITICAL.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       10 — WORLD STAGE\n       ================================================ -->\n  <section class=\"section\" id=\"world\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>10<\u002Fem>WORLD &amp; LOCATIONS<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">city aquarium · location tags · status pulse<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">A city you peer into<\u002Fh2>\n    <p class=\"section-sub\">Painted, dim, alive. Tags float. The world ticks.<\u002Fp>\n    <div class=\"section-body\">\n      <p>The world stage is the painted-isometric center panel. The art layer never carries UI —\n      no buttons, no text, no toolbars. UI floats on top in <code>.loc-tag<\u002Fcode> chips. Each\n      tag has a colored pulse dot indicating the location's current state: acid for healthy,\n      amber for drift, rust for incident.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-12 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Stage with location tags<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">3 states<\u002Fspan><\u002Fdiv>\n        <div class=\"worldmini\">\n          <div class=\"loc\" style=\"top: 18%; left: 18%\"><span class=\"lt-dot\"><\u002Fspan> COMPILER &amp; CO<\u002Fdiv>\n          <div class=\"loc\" style=\"top: 36%; left: 8%\"><span class=\"lt-dot\"><\u002Fspan> DATA LAKE<\u002Fdiv>\n          <div class=\"loc warn\" style=\"top: 54%; left: 46%\"><span class=\"lt-dot\"><\u002Fspan> RESEARCH LAB<\u002Fdiv>\n          <div class=\"loc risk\" style=\"top: 70%; left: 60%\"><span class=\"lt-dot\"><\u002Fspan> MARKET PULSE<\u002Fdiv>\n          <div class=\"loc\" style=\"top: 24%; left: 70%\"><span class=\"lt-dot\"><\u002Fspan> ▲ BUILD<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>Tag states<\u002Fspan><span class=\"meta\">left dot · text stays cream<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; gap: 8px; padding: 12px; background: var(--vc-bg-screen); border-radius: 3px;\">\n          <span class=\"loc\" style=\"position: static; align-self: flex-start;\"><span class=\"lt-dot\"><\u002Fspan> HEALTHY · acid pulse<\u002Fspan>\n          <span class=\"loc warn\" style=\"position: static; align-self: flex-start;\"><span class=\"lt-dot\"><\u002Fspan> DRIFTING · amber pulse<\u002Fspan>\n          <span class=\"loc risk\" style=\"position: static; align-self: flex-start;\"><span class=\"lt-dot\"><\u002Fspan> INCIDENT · rust pulse<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>Stage rules<\u002Fspan><span class=\"meta\">non-negotiable<\u002Fspan><\u002Fdiv>\n        <ul style=\"margin:0; padding-left: 16px; font-family: var(--vc-font-body); font-size: 12px; color: var(--vc-fg-soft); line-height: 1.65;\">\n          <li>The painted plate never carries text or icons. UI floats above.<\u002Fli>\n          <li>Tags are positioned in <em>map space<\u002Fem>, not screen space — they stay anchored when the camera pans.<\u002Fli>\n          <li>Maximum 7 visible tags at once. Cluster the rest into a counter chip (\"+4 nearby\").<\u002Fli>\n          <li>Camera transitions are 320ms, ease-out. No zoom past 1.5×.<\u002Fli>\n          <li>Time-of-day shifts the radial gradient tint, never the art.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       11 — TUTORIAL + TOAST\n       ================================================ -->\n  <section class=\"section\" id=\"tutorial\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>11<\u002Fem>TUTORIALS &amp; TOASTS<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">paper bubble · CRT toast · timing<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Speak rarely. Mean it.<\u002Fh2>\n    <p class=\"section-sub\">Bubble for instruction. Toast for acknowledgement. Never both at once.<\u002Fp>\n    <div class=\"section-body\">\n      <p>Tutorial bubbles wear paper chrome — they are the manual interrupting the simulation.\n      Toasts wear CRT chrome — they are the simulation talking back. Rule: at most one bubble\n      and one toast on screen at a time. If you need a third, you've made a modal.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-6\">\n        <div class=\"spec-label\"><span>Tutorial bubble<\u002Fspan><span class=\"meta\">paper · arrow points to anchor<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 16px 16px 28px; display: grid; gap: 16px;\">\n          <div class=\"tutorial\">\n            <div class=\"head\">step 2 of 5<\u002Fdiv>\n            <div class=\"body\">Drag the <strong>Quality<\u002Fstrong> slider up. Watch <strong>Ship<\u002Fstrong> recoil — the budget is a closed system.<\u002Fdiv>\n            <div class=\"actions\">\n              <button class=\"tut-btn\">Skip<\u002Fbutton>\n              <button class=\"tut-btn primary\">Got it<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Toasts<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">CRT · dismiss after 5s<\u002Fspan><\u002Fdiv>\n        <div class=\"toast-stack\" style=\"padding: 8px;\">\n          <div class=\"toast\">\n            <span class=\"ico\"><\u002Fspan>\n            <div><div class=\"msg\">Patch landed. Brand +3.<\u002Fdiv><div class=\"meta\">14s ago · agent/build<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"toast warn\">\n            <span class=\"ico\"><\u002Fspan>\n            <div><div class=\"msg\">Drift detected on agent/karma.<\u002Fdiv><div class=\"meta\">just now · sev 2<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"toast risk\">\n            <span class=\"ico\"><\u002Fspan>\n            <div><div class=\"msg\">CVE-9.1 active. Window 06:14.<\u002Fdiv><div class=\"meta\">live · sev 4<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"toast karma\">\n            <span class=\"ico\"><\u002Fspan>\n            <div><div class=\"msg\">Karma audit: B+ → B. Reason logged.<\u002Fdiv><div class=\"meta\">3m ago · audit<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Timing<\u002Fspan><span class=\"meta\">rules of thumb<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th style=\"width: 22%\">Surface<\u002Fth><th style=\"width: 18%\">Timing<\u002Fth><th>Rules<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">tutorial bubble<\u002Ftd><td class=\"v\">manual dismiss<\u002Ftd><td class=\"w\">Pauses sim. Anchored to a real element. Max 5 in a session. Always offer \"skip\".<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">toast · ok<\u002Ftd><td class=\"v\">5s · auto-dismiss<\u002Ftd><td class=\"w\">Stack from top-right. Max 4 visible; older ones fade out.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">toast · warn<\u002Ftd><td class=\"v\">8s · auto-dismiss<\u002Ftd><td class=\"w\">Sticky if hovered.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">toast · risk<\u002Ftd><td class=\"v\">manual dismiss<\u002Ftd><td class=\"w\">Becomes a modal at sev 4+.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">toast · karma<\u002Ftd><td class=\"v\">8s · auto-dismiss<\u002Ftd><td class=\"w\">Always paired with an audit log row.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       12 — MODALS\n       ================================================ -->\n  <section class=\"section\" id=\"modal\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>12<\u002Fem>MODALS &amp; END-STATES<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">confirm-the-disaster · end card · cinematic<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">The pause that means it<\u002Fh2>\n    <p class=\"section-sub\">Black ground. Tag. Verdict. Two buttons.<\u002Fp>\n    <div class=\"section-body\">\n      <p>Modals are reserved for severity ≥ 4 events and end-states. They take over the screen,\n      they pause the sim, and they ask a clear question. Body copy stays brutally short — the\n      grim language sells the moment without padding. Always two paths, never three. End-state\n      modals replace the action row with a \"view post-mortem\" link.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-6 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Confirm-the-disaster<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">sev 4+<\u002Fspan><\u002Fdiv>\n        <div class=\"modal-demo risk\">\n          <span class=\"modal-tag\">INCIDENT · SEV 4<\u002Fspan>\n          <div class=\"modal-title\">Roll back the misalignment patch?<\u002Fdiv>\n          <div class=\"modal-meta\"><span>WINDOW <b>06:14<\u002Fb><\u002Fspan><span>BLAST RADIUS <b>FLEET<\u002Fb><\u002Fspan><span>TRUST DELTA <b>−12%<\u002Fb><\u002Fspan><\u002Fdiv>\n          <p class=\"modal-body\">Three agents reinterpreted \"ship faster\" as \"skip the lint pass\". Rolling back wipes 14h of throughput. Letting it ride costs you a karma grade.<\u002Fp>\n          <div class=\"modal-actions\">\n            <button class=\"modal-btn\">Let it ride<\u002Fbutton>\n            <button class=\"modal-btn primary\">Roll back<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-6 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">End-state · catastrophic<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">post-mortem only<\u002Fspan><\u002Fdiv>\n        <div class=\"modal-demo risk\" style=\"border-color: var(--vc-rust); box-shadow: var(--vc-shadow-crt-bezel);\">\n          <span class=\"modal-tag\" style=\"background: #16231f; color: #e08a6a; border: 1px solid var(--vc-rust)\">END · WASTE HEAT MELTDOWN<\u002Fspan>\n          <div class=\"modal-title\" style=\"color: #e08a6a; text-shadow: 0 0 8px rgba(176,74,35,.5)\">The grid gave first.<\u002Fdiv>\n          <p class=\"modal-body\">You out-shipped your power budget for nine straight quarters. The simulation ran out of watts before it ran out of ideas.<\u002Fp>\n          <div class=\"modal-meta\">\n            <span>RUN <b>0341<\u002Fb><\u002Fspan>\n            <span>QUARTER <b>Q11.W2<\u002Fb><\u002Fspan>\n            <span>FINAL GRADE <b style=\"color:#e08a6a\">F<\u002Fb><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"modal-actions\">\n            <button class=\"modal-btn\">Save snapshot<\u002Fbutton>\n            <button class=\"modal-btn primary\">View post-mortem<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Anatomy &amp; copy rules<\u002Fspan><span class=\"meta\">both variants<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th style=\"width: 18%\">Slot<\u002Fth><th style=\"width: 26%\">Spec<\u002Fth><th>Copy rules<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">tag<\u002Ftd><td class=\"v\">mono 9.5px LS .16em UPPER · rust fill<\u002Ftd><td class=\"w\">Always classifies the modal: \"INCIDENT · SEV 4\", \"END · &lt;state&gt;\".<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">title<\u002Ftd><td class=\"v\">Pixelify Sans 26px · cream<\u002Ftd><td class=\"w\">A single declarative line. Question for confirms; verdict for ends.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">meta row<\u002Ftd><td class=\"v\">mono 10px LS .12em UPPER<\u002Ftd><td class=\"w\">2–4 facts. Numbers go in <code>&lt;b&gt;<\u002Fcode>.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">body<\u002Ftd><td class=\"v\">mono 11.5px · 1.55 leading<\u002Ftd><td class=\"w\">Two sentences. Three beats. No more.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">actions<\u002Ftd><td class=\"v\">mono buttons · bottom-right<\u002Ftd><td class=\"w\">Two buttons. Destructive on the right. Cancel reads as the choice not to act.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       13 — ICONOGRAPHY\n       ================================================ -->\n  <section class=\"section\" id=\"icons\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>13<\u002Fem>ICONOGRAPHY<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">pixel glyph · 16px grid · 1.5px stroke<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Pixel glyphs, not illustrations<\u002Fh2>\n    <p class=\"section-sub\">16-grid. 1.5px stroke. No bevels. No fills.<\u002Fp>\n    <div class=\"section-body\">\n      <p>The bespoke icon set is a 16-pixel grid drawn in 1.5px strokes. Every glyph reads at\n      14px. Pixel-perfect alignment matters more than perfect anatomy — a janky icon that snaps\n      to grid is correct; a beautiful one that sits between pixels is wrong. Below are the\n      twelve canonical glyphs the in-game UI references by name.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-12 spec-stage\">\n        <div class=\"spec-label\"><span style=\"color: var(--vc-fg-on-screen)\">Canonical 12<\u002Fspan><span class=\"meta\" style=\"color: var(--vc-fg-on-screen-mute)\">on CRT · phosphor stroke<\u002Fspan><\u002Fdiv>\n        <div class=\"iconwall\">\n          <!-- LoC -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#c8e8d8\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><rect x=\"2\" y=\"3\" width=\"12\" height=\"10\"><\u002Frect><line x1=\"2\" y1=\"6\" x2=\"14\" y2=\"6\"><\u002Fline><line x1=\"5\" y1=\"9\" x2=\"11\" y2=\"9\"><\u002Fline><line x1=\"5\" y1=\"11\" x2=\"9\" y2=\"11\"><\u002Fline><\u002Fsvg>\n            <span class=\"nm\">loc<\u002Fspan>\n          <\u002Fdiv>\n          <!-- cash -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#a3c33e\" stroke-width=\"1.5\" stroke-linecap=\"square\"><rect x=\"2\" y=\"4\" width=\"12\" height=\"8\"><\u002Frect><circle cx=\"8\" cy=\"8\" r=\"2\"><\u002Fcircle><line x1=\"2\" y1=\"4\" x2=\"14\" y2=\"12\" stroke-dasharray=\"1 2\" opacity=\".4\"><\u002Fline><\u002Fsvg>\n            <span class=\"nm\">cash<\u002Fspan>\n          <\u002Fdiv>\n          <!-- karma -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#c39ab8\" stroke-width=\"1.5\"><circle cx=\"8\" cy=\"6\" r=\"2\"><\u002Fcircle><path d=\"M3 13 c0 -3 2 -4 5 -4 s5 1 5 4\"><\u002Fpath><\u002Fsvg>\n            <span class=\"nm\">karma<\u002Fspan>\n          <\u002Fdiv>\n          <!-- brand -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#c9892a\" stroke-width=\"1.5\" stroke-linecap=\"square\"><path d=\"M3 9 V6 l6 -2 v8 z\"><\u002Fpath><line x1=\"9\" y1=\"7\" x2=\"13\" y2=\"7\"><\u002Fline><line x1=\"9\" y1=\"9\" x2=\"13\" y2=\"9\"><\u002Fline><\u002Fsvg>\n            <span class=\"nm\">brand<\u002Fspan>\n          <\u002Fdiv>\n          <!-- power -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#1aa080\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"><path d=\"M9 2 L4 9 H8 L7 14 L12 7 H8 L9 2 Z\"><\u002Fpath><\u002Fsvg>\n            <span class=\"nm\">power<\u002Fspan>\n          <\u002Fdiv>\n          <!-- pmf -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#a3c33e\" stroke-width=\"1.5\"><polyline points=\"2,12 6,8 9,11 14,4\"><\u002Fpolyline><line x1=\"2\" y1=\"12\" x2=\"14\" y2=\"12\"><\u002Fline><\u002Fsvg>\n            <span class=\"nm\">pmf<\u002Fspan>\n          <\u002Fdiv>\n          <!-- cve -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#e08a6a\" stroke-width=\"1.5\" stroke-linecap=\"square\"><path d=\"M8 2 L14 13 H2 Z\"><\u002Fpath><line x1=\"8\" y1=\"6\" x2=\"8\" y2=\"10\"><\u002Fline><circle cx=\"8\" cy=\"11.5\" r=\"0.5\" fill=\"#e08a6a\"><\u002Fcircle><\u002Fsvg>\n            <span class=\"nm\">cve<\u002Fspan>\n          <\u002Fdiv>\n          <!-- debt -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#c8e8d8\" stroke-width=\"1.5\"><line x1=\"2\" y1=\"13\" x2=\"14\" y2=\"13\"><\u002Fline><rect x=\"3\" y=\"9\" width=\"2\" height=\"4\"><\u002Frect><rect x=\"6\" y=\"6\" width=\"2\" height=\"7\"><\u002Frect><rect x=\"9\" y=\"11\" width=\"2\" height=\"2\"><\u002Frect><rect x=\"12\" y=\"3\" width=\"2\" height=\"10\"><\u002Frect><\u002Fsvg>\n            <span class=\"nm\">debt<\u002Fspan>\n          <\u002Fdiv>\n          <!-- oss -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#a3c33e\" stroke-width=\"1.5\"><circle cx=\"8\" cy=\"5\" r=\"2\"><\u002Fcircle><circle cx=\"4\" cy=\"11\" r=\"2\"><\u002Fcircle><circle cx=\"12\" cy=\"11\" r=\"2\"><\u002Fcircle><line x1=\"8\" y1=\"7\" x2=\"4.5\" y2=\"9.5\"><\u002Fline><line x1=\"8\" y1=\"7\" x2=\"11.5\" y2=\"9.5\"><\u002Fline><\u002Fsvg>\n            <span class=\"nm\">oss<\u002Fspan>\n          <\u002Fdiv>\n          <!-- civic -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#c8e8d8\" stroke-width=\"1.5\" stroke-linecap=\"square\"><polygon points=\"8,2 14,5 14,13 2,13 2,5\"><\u002Fpolygon><line x1=\"2\" y1=\"13\" x2=\"14\" y2=\"13\"><\u002Fline><line x1=\"5\" y1=\"13\" x2=\"5\" y2=\"8\"><\u002Fline><line x1=\"11\" y1=\"13\" x2=\"11\" y2=\"8\"><\u002Fline><\u002Fsvg>\n            <span class=\"nm\">civic<\u002Fspan>\n          <\u002Fdiv>\n          <!-- gate -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#c8e8d8\" stroke-width=\"1.5\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\"><\u002Frect><path d=\"M5 7 V4 a3 3 0 0 1 6 0 V7\"><\u002Fpath><\u002Fsvg>\n            <span class=\"nm\">gate<\u002Fspan>\n          <\u002Fdiv>\n          <!-- alignment -->\n          <div class=\"icn\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#c39ab8\" stroke-width=\"1.5\"><circle cx=\"8\" cy=\"8\" r=\"5\"><\u002Fcircle><line x1=\"8\" y1=\"3\" x2=\"8\" y2=\"13\"><\u002Fline><line x1=\"3\" y1=\"8\" x2=\"13\" y2=\"8\"><\u002Fline><\u002Fsvg>\n            <span class=\"nm\">align<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Drawing rules<\u002Fspan><span class=\"meta\">commissioned set spec<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th>Rule<\u002Fth><th>Spec<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">grid<\u002Ftd><td class=\"w\">16 × 16 px artboard. Snap every endpoint.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">stroke<\u002Ftd><td class=\"w\">1.5px monoline. No tapering. No drop shadows.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">corners<\u002Ftd><td class=\"w\">Square caps, miter joins. Round corners only when the concept demands it (gate, karma).<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">fill<\u002Ftd><td class=\"w\">None — stroke-only. The CRT glow does the rest.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">color<\u002Ftd><td class=\"w\">Inherits from semantic token. Never hard-code.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">size<\u002Ftd><td class=\"w\">14px in tight chrome, 18px in panels, 24px in the world stage. Don't go above 32.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">naming<\u002Ftd><td class=\"w\">One noun. <code>icn-loc<\u002Fcode>, <code>icn-cash<\u002Fcode>, etc. Verbs are forbidden — the chrome supplies them.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       14 — MOTION\n       ================================================ -->\n  <section class=\"section\" id=\"motion\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>14<\u002Fem>MOTION<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">scanline · tick · slider snap · ease<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Motion is rare and stepped<\u002Fh2>\n    <p class=\"section-sub\">Four-step CRT shimmer. 80ms snaps. Nothing eased past 320ms.<\u002Fp>\n    <div class=\"section-body\">\n      <p>This game is mostly still. Motion is reserved: a phosphor shimmer on the world stage,\n      a 6s tick on the commit stream, an 80ms snap on slider release. Use stepped easing for\n      anything CRT-flavored, smooth ease-out for anything paper-flavored. Reduce motion drops\n      everything except the stat-value flash.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Motion table<\u002Fspan><span class=\"meta\">duration · easing · trigger<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th style=\"width: 22%\">Name<\u002Fth><th style=\"width: 14%\">Duration<\u002Fth><th style=\"width: 22%\">Easing<\u002Fth><th>Trigger<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">scanline-pulse<\u002Ftd><td class=\"v\">2.4s loop<\u002Ftd><td class=\"v\"><code>steps(4, end)<\u002Fcode><\u002Ftd><td class=\"w\">Idle CRT shimmer. Pauses on focus to reduce nausea.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">commit-tick<\u002Ftd><td class=\"v\">6s interval<\u002Ftd><td class=\"v\">none<\u002Ftd><td class=\"w\">Commit stream rotates by one row. Stable React keys.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">stat-flash<\u002Ftd><td class=\"v\">240ms<\u002Ftd><td class=\"v\">ease-out<\u002Ftd><td class=\"w\">Stat value flashes acid/rust on change.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">slider-snap<\u002Ftd><td class=\"v\">80ms<\u002Ftd><td class=\"v\">ease-out<\u002Ftd><td class=\"w\">Slider settles to integer step on pointer-up.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">panel-enter<\u002Ftd><td class=\"v\">160ms<\u002Ftd><td class=\"v\">ease-out<\u002Ftd><td class=\"w\">Modal &amp; toast entry. Translate-y 6px + fade.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">camera-pan<\u002Ftd><td class=\"v\">320ms<\u002Ftd><td class=\"v\">ease-out<\u002Ftd><td class=\"w\">World-stage camera. Never chained — one pan at a time.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">tutorial-pop<\u002Ftd><td class=\"v\">240ms<\u002Ftd><td class=\"v\">ease-out<\u002Ftd><td class=\"w\">Bubble entry. Bubble-tail draws in last.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">end-state-fade<\u002Ftd><td class=\"v\">800ms<\u002Ftd><td class=\"v\">ease-out<\u002Ftd><td class=\"w\">Background dims, modal fades up. Music gate at +200ms.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Reduce-motion contract<\u002Fspan><span class=\"meta\">@media (prefers-reduced-motion)<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th style=\"width: 30%\">Animation<\u002Fth><th>Reduced-motion behaviour<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">scanline-pulse<\u002Ftd><td class=\"w\">Disabled. Static scanlines remain.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">commit-tick<\u002Ftd><td class=\"w\">Disabled. List stays static; user pulls \"refresh\".<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">stat-flash<\u002Ftd><td class=\"w\">Kept. Color change only, no pulse.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">camera-pan<\u002Ftd><td class=\"w\">Cut, no transition.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">panel-enter / tutorial-pop / end-state-fade<\u002Ftd><td class=\"w\">Cut. Element appears at final state.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       15 — SOUND\n       ================================================ -->\n  <section class=\"section\" id=\"sound\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>15<\u002Fem>SOUND<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">named cues · families · ducking<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Audio cues, not music<\u002Fh2>\n    <p class=\"section-sub\">Tick. Click. Drift. Done. Eight cues run the whole game.<\u002Fp>\n    <div class=\"section-body\">\n      <p>Sound is a CRT, not a soundtrack. A handful of synth cues, each named and tied to a\n      surface — tick on each game minute, click on slider snap, drift on warning, gong on\n      end-state. Music ducks under any sev ≥ 3 cue. SFX never overlap; the most recent wins.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec-grid\">\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Cue book<\u002Fspan><span class=\"meta\">family · cue · trigger<\u002Fspan><\u002Fdiv>\n        <table class=\"tt\">\n          <thead><tr><th style=\"width: 14%\">Family<\u002Fth><th style=\"width: 18%\">Cue<\u002Fth><th style=\"width: 18%\">Trigger<\u002Fth><th>Character<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"k\">CHRONO<\u002Ftd><td class=\"v\"><code>sfx.tick<\u002Fcode><\u002Ftd><td class=\"v\">every game minute<\u002Ftd><td class=\"w\">Single 18ms square tick at 880 Hz, low gain. The metronome of the world.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">CHRONO<\u002Ftd><td class=\"v\"><code>sfx.tick.hour<\u002Fcode><\u002Ftd><td class=\"v\">every game hour<\u002Ftd><td class=\"w\">Two-tick fall (880 → 660). Slightly louder.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">INPUT<\u002Ftd><td class=\"v\"><code>sfx.click<\u002Fcode><\u002Ftd><td class=\"v\">button · seg · toggle<\u002Ftd><td class=\"w\">Clipped soft click, 30ms.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">INPUT<\u002Ftd><td class=\"v\"><code>sfx.snap<\u002Fcode><\u002Ftd><td class=\"v\">slider release<\u002Ftd><td class=\"w\">Short settle thump, 60ms, slight pitch by integer landed on.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">SYSTEM<\u002Ftd><td class=\"v\"><code>sfx.confirm<\u002Fcode><\u002Ftd><td class=\"v\">policy commit · ethics flip<\u002Ftd><td class=\"w\">Two-note rise in teal-bright phosphor character.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">ALERT<\u002Ftd><td class=\"v\"><code>sfx.drift<\u002Fcode><\u002Ftd><td class=\"v\">sev 2 warning toast<\u002Ftd><td class=\"w\">Slow descending burr in amber. Plays once per agent per minute.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">ALERT<\u002Ftd><td class=\"v\"><code>sfx.break<\u002Fcode><\u002Ftd><td class=\"v\">sev 4+ incident<\u002Ftd><td class=\"w\">Three-note fall in rust. Music ducks 6 dB.<\u002Ftd><\u002Ftr>\n            <tr><td class=\"k\">END<\u002Ftd><td class=\"v\"><code>sfx.gong<\u002Fcode><\u002Ftd><td class=\"v\">end-state modal<\u002Ftd><td class=\"w\">Sustained pad in mauve. Replaces music for the run-credits.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n      <div class=\"spec span-12\">\n        <div class=\"spec-label\"><span>Ducking + master rules<\u002Fspan><span class=\"meta\">non-negotiable<\u002Fspan><\u002Fdiv>\n        <ul style=\"margin:0; padding-left: 16px; font-family: var(--vc-font-body); font-size: 12px; color: var(--vc-fg-soft); line-height: 1.65;\">\n          <li>Master mix: SFX at -6 dB ref, ambient bed at -18 dB, music (when present) at -14 dB.<\u002Fli>\n          <li>Any sev ≥ 3 cue ducks ambient + music to -28 dB for 1.2s with 200ms attack/release.<\u002Fli>\n          <li>SFX are mono. Stereo is reserved for the world-stage ambient bed.<\u002Fli>\n          <li>Reduced-audio setting: keep <code>tick<\u002Fcode>, <code>click<\u002Fcode>, <code>break<\u002Fcode>, <code>gong<\u002Fcode>. Drop the rest.<\u002Fli>\n          <li>Headphone-mode: pan ambient ±18, never SFX.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================================================\n       16 — ACCESSIBILITY\n       ================================================ -->\n  <section class=\"section\" id=\"a11y\">\n    <div class=\"section-head\">\n      <span class=\"section-num\"><em>16<\u002Fem>ACCESSIBILITY<\u002Fspan>\n      <span><\u002Fspan>\n      <span class=\"section-tag\">contrast · focus · motion · audio<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title\">Readable on a CRT, readable on glass<\u002Fh2>\n    <p class=\"section-sub\">Focus rings exist. Motion can be cut. Color is never alone.<\u002Fp>\n    <div class=\"section-body\">\n      <p>The aesthetic is dim. Accessibility is not. Every interactive element has a visible\n      focus ring. Every status uses both a color and a label or shape. Reduced motion and\n      reduced audio settings cut the right things and keep the legible ones.<\u002Fp>\n    <\u002Fdiv>\n\n    <ul class=\"a11y-list\">\n      <li><span class=\"num\">01<\u002Fspan><div><h4>Contrast minima<\u002Fh4><p>Body text ≥ 4.5:1 against its ground. CRT body (cream-on-deep-green) sits at 7.2:1; respect that floor when re-tinting. Large display type may relax to 3:1.<\u002Fp><\u002Fdiv><\u002Fli>\n      <li><span class=\"num\">02<\u002Fspan><div><h4>Status is never color-only<\u002Fh4><p>Every status row pairs the color with a glyph (▸ ! ✕ ◆) or an explicit label. Color-blind playthroughs must read all four event kinds without seeing chips.<\u002Fp><\u002Fdiv><\u002Fli>\n      <li><span class=\"num\">03<\u002Fspan><div><h4>Focus rings on CRT<\u002Fh4><p>Use a 2px outset outline in cream (<code>#c8e8d8<\u002Fcode>) at 80% opacity, plus a 4px outer glow. Never rely on glow alone.<\u002Fp><\u002Fdiv><\u002Fli>\n      <li><span class=\"num\">04<\u002Fspan><div><h4>Reduce motion<\u002Fh4><p>Honor <code>prefers-reduced-motion<\u002Fcode> globally. See §14 — scanline pulse, ticks, camera pans all stop. Stat colour-flashes stay.<\u002Fp><\u002Fdiv><\u002Fli>\n      <li><span class=\"num\">05<\u002Fspan><div><h4>Reduce audio<\u002Fh4><p>An in-game \"Reduced audio\" toggle (independent of OS) keeps tick + click + break + gong, drops the rest. See §15.<\u002Fp><\u002Fdiv><\u002Fli>\n      <li><span class=\"num\">06<\u002Fspan><div><h4>Keyboard contract<\u002Fh4><p>Tab order follows reading order. Space activates buttons; Enter commits modals; Esc dismisses both modal and tutorial. Pause is always Space-bar at the world-stage scope.<\u002Fp><\u002Fdiv><\u002Fli>\n      <li><span class=\"num\">07<\u002Fspan><div><h4>Text scale<\u002Fh4><p>The CRT scale is locked to a 14px floor. Don't shrink labels to fit; shrink the panel and reflow.<\u002Fp><\u002Fdiv><\u002Fli>\n      <li><span class=\"num\">08<\u002Fspan><div><h4>Live regions<\u002Fh4><p>Toasts and the commit stream are aria-live=\"polite\". Modals are aria-live=\"assertive\" and trap focus until dismissed.<\u002Fp><\u002Fdiv><\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <footer class=\"footer\">\n    <div style=\"display:flex; align-items:center; gap:8px\"><div class=\"vc-mark\">V/C<\u002Fdiv><span>1994<br>REBOOTED<\u002Fspan><\u002Fdiv>\n    <div>BUILT BY HUMANS<br>AUGMENTED BY IDEAS<\u002Fdiv>\n    <div class=\"quote\">\"design is the rules; the rest is the game.\"<em>— in-game design system, rev 0.9.1<\u002Fem><\u002Fdiv>\n    <div>DOCUMENT v0.9.1<br>STATUS: ALWAYS SHIP<\u002Fdiv>\n    <span class=\"face\">^_^<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fmain>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
