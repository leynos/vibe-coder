name: semantic-lint

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Enforce Oxford spelling
        run: make spelling
      - run: bun install --frozen-lockfile
      - name: Validate runner contracts
        run: bun test tests/workflow-runners.config.test.ts
      - name: Validate the TypeDoc documentation gate
        run: bun run docs:check
      - run: bun semantic
