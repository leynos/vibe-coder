name: semantic-lint

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Enforce Oxford spelling
        run: make spelling
      - run: bun install --frozen-lockfile
      - run: bun semantic
