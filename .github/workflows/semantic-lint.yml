name: semantic-lint

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Enforce Oxford spelling
        run: make spelling
      - run: bun install --frozen-lockfile
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          version: "0.6.0"
      - name: Check formatting
        run: make check-fmt
      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match the local run.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Validate workflow contracts
        run: bun test tests/workflow-runners.config.test.ts tests/workflow-build-test.config.test.ts
      - name: Validate the TypeDoc documentation gate
        run: bun run docs:check
      - run: bun semantic

  # Builds the site and runs the test suite on every pull request, so a
  # change that breaks either (including a Dependabot bump that automerge
  # would otherwise land) turns the required `build-test` check red.
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The build and tests run dependency code that needs no Git token.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "latest"
      - run: bun install --frozen-lockfile
      - run: bun run tokens:build
      - run: bun run build
      - run: bun run test
